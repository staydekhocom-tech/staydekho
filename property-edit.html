<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Property — StayDekho Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red:#8B1717; --red-dark:#6b1010; --red-light:#fef2f2;
      --green:#16a34a; --green-light:#f0fdf4;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
      --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-800:#1f2937;
      --white:#fff; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.1);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#f5f0eb;color:var(--gray-800);min-height:100vh;}

    .topbar{
      position:sticky;top:0;z-index:100;
      background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--gray-200);
      padding:14px 32px;display:flex;align-items:center;gap:16px;
    }
    .topbar-back{
      display:inline-flex;align-items:center;gap:6px;color:var(--gray-500);
      text-decoration:none;font-size:.85rem;font-weight:600;
      padding:8px 14px;border:1.5px solid var(--gray-200);border-radius:10px;
      transition:all .2s;
    }
    .topbar-back:hover{color:var(--gray-800);border-color:var(--gray-400);}
    .topbar-title{font-size:1.1rem;font-weight:800;flex:1;}
    .topbar-actions{display:flex;gap:10px;}
    .btn{
      display:inline-flex;align-items:center;gap:7px;
      padding:10px 20px;border-radius:10px;font-size:.88rem;font-weight:700;
      border:none;cursor:pointer;transition:all .2s;font-family:inherit;
    }
    .btn-primary{background:var(--red);color:#fff;}
    .btn-primary:hover{background:var(--red-dark);}
    .btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200);}
    .btn-outline:hover{border-color:var(--gray-400);}
    .btn-green{background:var(--green);color:#fff;}
    .btn-green:hover{background:#15803d;}
    .btn-danger{background:#fff;color:#dc2626;border:1.5px solid #fecaca;}
    .btn-danger:hover{background:#fef2f2;}
    .btn-sm{padding:7px 14px;font-size:.8rem;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}

    .page{max-width:960px;margin:0 auto;padding:32px 24px 80px;}
    .section{background:#fff;border-radius:16px;border:1px solid var(--gray-200);margin-bottom:20px;overflow:hidden;}
    .section-header{
      padding:18px 24px;border-bottom:1px solid var(--gray-100);
      display:flex;align-items:center;gap:10px;
    }
    .section-icon{
      width:34px;height:34px;border-radius:9px;background:var(--red-light);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .section-icon svg{width:16px;height:16px;color:var(--red);stroke:var(--red);}
    .section-title{font-size:.92rem;font-weight:800;}
    .section-body{padding:24px;}

    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .field.full{grid-column:1/-1;}
    label{font-size:.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.07em;}
    input[type=text],input[type=number],input[type=time],select,textarea{
      width:100%;padding:11px 14px;border:1.5px solid var(--gray-200);border-radius:10px;
      font-family:inherit;font-size:.9rem;color:var(--gray-800);background:#fff;
      outline:none;transition:border-color .2s;
    }
    input:focus,select:focus,textarea:focus{border-color:var(--red);}
    textarea{resize:vertical;min-height:100px;line-height:1.6;}
    .hint{font-size:.73rem;color:var(--gray-400);margin-top:3px;}

    .status-toggle{display:flex;gap:10px;}
    .status-opt{
      flex:1;padding:10px;border:2px solid var(--gray-200);border-radius:10px;
      text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;
    }
    .status-opt.active-opt{border-color:var(--green);background:var(--green-light);color:var(--green);}
    .status-opt.inactive-opt{border-color:#dc2626;background:#fef2f2;color:#dc2626;}

    .amenity-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
    .amenity-tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 12px;background:var(--red-light);color:var(--red);
      border-radius:20px;font-size:.82rem;font-weight:600;
    }
    .amenity-tag button{
      background:none;border:none;cursor:pointer;color:var(--red);
      font-size:1rem;line-height:1;padding:0;opacity:.7;transition:opacity .15s;
    }
    .amenity-tag button:hover{opacity:1;}
    .add-row{display:flex;gap:10px;}
    .add-row input{flex:1;}

    .rules-textarea{
      width:100%;min-height:160px;resize:vertical;
      border:1.5px solid var(--gray-200);border-radius:10px;
      padding:12px 14px;font-family:inherit;font-size:.88rem;
      color:var(--gray-800);line-height:1.85;outline:none;
      background:#fafafa;transition:border-color .2s;
    }
    .rules-textarea:focus{border-color:var(--red);background:#fff;}

    .images-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
    .img-item{border:1.5px solid var(--gray-200);border-radius:12px;overflow:hidden;background:#fafafa;}
    .img-item img{width:100%;height:110px;object-fit:cover;display:block;}
    .img-item-body{padding:10px;}
    .img-cat-input{
      width:100%;border:1.5px solid var(--gray-200);border-radius:7px;
      padding:6px 9px;font-size:.78rem;font-family:inherit;outline:none;
      background:#fff;transition:border-color .2s;
    }
    .img-cat-input:focus{border-color:var(--red);}
    .img-del-btn{
      display:flex;align-items:center;gap:5px;margin-top:7px;
      background:none;border:none;cursor:pointer;color:var(--gray-400);
      font-size:.75rem;font-weight:600;padding:0;transition:color .15s;
    }
    .img-del-btn:hover{color:#dc2626;}

    /* ── Photo drag-reorder ─────────────────────────── */
    .img-item { cursor: default; transition: opacity .15s, box-shadow .15s; }
    .img-drag-handle {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 5px 0 7px; cursor: grab; color: var(--gray-400);
      font-size: .7rem; font-weight: 600; user-select: none;
      border-bottom: 1px solid var(--gray-100); margin-bottom: 7px;
      letter-spacing: .03em; transition: color .15s;
    }
    .img-drag-handle:hover { color: var(--red); }
    .img-drag-handle:active { cursor: grabbing; }
    .img-item.img-dragging { opacity: .3; box-shadow: none; }
    .img-item.img-drop-here {
      outline: 2.5px solid var(--red);
      outline-offset: -2px;
      box-shadow: 0 0 0 4px rgba(139,23,23,.12);
    }
    .img-order-badge {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      background: rgba(0,0,0,.55); color: #fff;
      font-size: .65rem; font-weight: 700; border-radius: 5px;
      padding: 2px 7px; pointer-events: none;
    }
    .img-item { position: relative; }

    .img-url-field{display:flex;gap:8px;margin-bottom:10px;}
    .img-url-field input{flex:1;}
    .img-cat-field{display:flex;gap:8px;}
    .img-cat-field input{flex:1;}

    /* ── Category Chips ── */
    .cat-chips-wrap{margin-bottom:10px;}
    .cat-chips-label{font-size:.72rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
    .cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
    .cat-chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--gray-200);background:#fff;
      font-size:.76rem;font-weight:600;cursor:pointer;color:var(--gray-600);transition:all .15s;line-height:1.4;}
    .cat-chip:hover{border-color:var(--red);color:var(--red);background:#fff5f5;}
    .cat-chip.active{border-color:var(--red);color:var(--red);background:#fff5f5;}
    .sub-chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;}
    .sub-chip{padding:3px 10px;border-radius:20px;border:1.5px solid #e5e7eb;background:#f9fafb;
      font-size:.73rem;font-weight:600;cursor:pointer;color:var(--gray-500);transition:all .15s;}
    .sub-chip:hover{border-color:var(--red);color:var(--red);background:#fff5f5;}
    .sub-chip.active{border-color:var(--red);color:var(--red);background:#fff5f5;}
    .add-img-box{
      border:2px dashed var(--gray-200);border-radius:12px;padding:20px;
      background:#fafafa;
    }
    .add-img-box h4{font-size:.82rem;font-weight:700;margin-bottom:12px;color:var(--gray-600);}

    .regen-box{
      background:var(--red-light);border:1.5px solid #fecaca;border-radius:12px;
      padding:16px 18px;display:flex;align-items:center;gap:14px;margin-top:16px;
    }
    .regen-box p{font-size:.82rem;color:var(--gray-600);flex:1;line-height:1.5;}
    .regen-box strong{color:var(--red);}

    #toast{
      position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);
      background:#1a0a0a;color:#fff;padding:12px 24px;border-radius:28px;
      font-size:.85rem;font-weight:600;z-index:9999;opacity:0;
      transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    #toast.success{background:#16a34a;}
    #toast.error{background:#dc2626;}

    .spin{
      display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Device Upload UI ───────────────────────────── */
    .upload-actions{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .upload-btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 18px;background:var(--red);color:#fff;
      border-radius:10px;font-size:.85rem;font-weight:700;
      cursor:pointer;transition:background .2s;font-family:inherit;border:none;
    }
    .upload-btn:hover{background:var(--red-dark);}
    .upload-counter{
      background:var(--gray-100);color:var(--gray-600);
      padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:700;
      display:inline-flex;align-items:center;
    }
    .drag-zone-hint{
      text-align:center;padding:18px 12px;
      border:2px dashed var(--gray-200);border-radius:10px;
      color:var(--gray-400);font-size:.82rem;margin-bottom:4px;
      transition:all .2s;user-select:none;
    }
    .add-img-box.drag-over .drag-zone-hint{
      border-color:var(--red);background:var(--red-light);color:var(--red);
    }
    .upload-status{
      padding:9px 14px;border-radius:8px;font-size:.82rem;font-weight:600;
      margin-top:8px;
    }
    .upload-status.uploading{background:#eff6ff;color:#1d4ed8;}
    .upload-status.success{background:var(--green-light);color:var(--green);}
    .upload-status.error{background:#fef2f2;color:#dc2626;}
    .url-divider{
      border-top:1px solid var(--gray-200);margin:14px 0 12px;
      padding-top:12px;
    }
    .url-divider-label{
      font-size:.72rem;font-weight:700;color:var(--gray-400);
      text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;
    }

    @media(max-width:700px){
      .topbar{padding:12px 16px;}
      .page{padding:20px 14px 60px;}
      .field-grid,.field-grid-3{grid-template-columns:1fr;}
      .images-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="topbar">
  <a class="topbar-back" href="admin.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Admin
  </a>
  <div class="topbar-title" id="page-title">Edit Property</div>
  <div class="topbar-actions">
    <a class="btn btn-outline btn-sm" id="view-btn" href="#" target="_blank">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      View Live
    </a>
    <button class="btn btn-primary" id="save-btn" onclick="saveAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Changes
    </button>
  </div>
</div>

<div class="page" id="page">
  <div style="text-align:center;padding:60px;color:var(--gray-400)" id="loading-state">
    <div class="spin" style="border-color:rgba(139,23,23,.3);border-top-color:var(--red);margin:0 auto 12px;width:28px;height:28px;"></div>
    Loading property…
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
if (!isLoggedIn() || !isAdmin()) {
  location.href = 'login.html';
}

const propId = new URLSearchParams(location.search).get('id');
if (!propId) { document.getElementById('loading-state').textContent = 'No property ID in URL.'; }

let PROP = null;
let amenities = [];
let rules = [];
let images = [];

async function loadProperty() {
  try {
    const { property } = await api.getProperty(propId);
    PROP = property;
    document.getElementById('page-title').textContent = `Edit: ${property.name}`;
    document.getElementById('view-btn').href = `property.html?id=${propId}`;
    amenities = [...(property.amenities || [])];
    rules     = [...(property.rules || getDefaultRules())];
    images    = [...(property.categorized_images || [])];
    buildForm();
  } catch(e) {
    document.getElementById('loading-state').textContent = 'Failed to load property: ' + e.message;
  }
}

function getDefaultRules() {
  return [
    { icon:'clock',     text:'Check-in after {checkin} · Check-out before {checkout}' },
    { icon:'nosmoking', text:'No smoking inside the property' },
    { icon:'party',     text:'Events / parties allowed with prior permission' },
    { icon:'pet',       text:'Pets welcome — please inform us in advance' },
    { icon:'quiet',     text:'Quiet hours after 11:00 PM' },
    { icon:'cancel',    text:'Free cancellation up to 7 days before check-in' },
  ];
}

function buildForm() {
  const p = PROP;
  document.getElementById('page').innerHTML = `
    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_INFO}</div>
        <span class="section-title">Basic Information</span>
      </div>
      <div class="section-body">
        <div class="field-grid" style="margin-bottom:16px">
          <div class="field">
            <label>Property Name</label>
            <input type="text" id="f-name" value="${esc(p.name||'')}" placeholder="e.g. Lakeside Villa"/>
          </div>
          <div class="field">
            <label>Location</label>
            <input type="text" id="f-location" value="${esc(p.location||'')}" placeholder="e.g. Udaipur, Rajasthan"/>
          </div>
          <div class="field">
            <label>Price per Night (₹)</label>
            <input type="number" id="f-price" value="${p.price||''}" min="0" placeholder="7500"/>
          </div>
          <div class="field">
            <label>Status</label>
            <div class="status-toggle">
              <div class="status-opt ${p.status==='Active'?'active-opt':''}" id="opt-active" onclick="setStatus('Active')">✓ Active</div>
              <div class="status-opt ${p.status!=='Active'?'inactive-opt':''}" id="opt-inactive" onclick="setStatus('Inactive')">✗ Inactive</div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="f-desc" rows="4" placeholder="Describe this property…">${esc(p.description||'')}</textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_CAPACITY}</div>
        <span class="section-title">Capacity & Layout</span>
      </div>
      <div class="section-body">
        <div class="field-grid-3">
          <div class="field">
            <label>Bedrooms (BHK)</label>
            <input type="number" id="f-beds" value="${p.beds||4}" min="1" max="20"/>
            <span class="hint">Affects Room 1, 2… categories</span>
          </div>
          <div class="field">
            <label>Bathrooms</label>
            <input type="number" id="f-bathrooms" value="${p.bathrooms||3}" min="1" max="20"/>
            <span class="hint">Affects Bathroom 1, 2… categories</span>
          </div>
          <div class="field">
            <label>Max Guests</label>
            <input type="number" id="f-guests" value="${p.guests||10}" min="1" max="100"/>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_CLOCK}</div>
        <span class="section-title">Check-in & Check-out Times</span>
      </div>
      <div class="section-body">
        <div class="field-grid">
          <div class="field">
            <label>Check-in Time</label>
            <input type="text" id="f-checkin" value="${esc(p.checkin_time||'2:00 PM')}" placeholder="2:00 PM"/>
            <span class="hint">e.g. 1:00 PM, 2:00 PM, 3:00 PM</span>
          </div>
          <div class="field">
            <label>Check-out Time</label>
            <input type="text" id="f-checkout" value="${esc(p.checkout_time||'11:00 AM')}" placeholder="11:00 AM"/>
            <span class="hint">e.g. 10:00 AM, 11:00 AM, 12:00 PM</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_AMENITY}</div>
        <span class="section-title">Amenities</span>
      </div>
      <div class="section-body">
        <div class="amenity-tags" id="amenity-tags"></div>
        <div class="add-row">
          <input type="text" id="amenity-input" placeholder="e.g. Swimming Pool, WiFi, AC, Chef…" onkeydown="if(event.key==='Enter'){addAmenity();event.preventDefault();}"/>
          <button class="btn btn-outline btn-sm" onclick="addAmenity()">+ Add</button>
        </div>
        <p class="hint" style="margin-top:8px">Press Enter or click Add. Click × on a tag to remove it.</p>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_RULES}</div>
        <span class="section-title">House Rules</span>
      </div>
      <div class="section-body">
        <textarea id="rules-textarea" class="rules-textarea"
          placeholder="Har rule ek nayi line mein likhein, jaise:
✅ Check-in after {checkin} · Check-out before {checkout}
🚫 No smoking inside the property
🎉 Parties allowed with prior permission
🐾 No pets allowed
🔇 Quiet hours after 11 PM">${(rules||[]).map(r => typeof r === 'string' ? r : (r.text||'')).filter(Boolean).join('\n')}</textarea>
        <p class="hint" style="margin-top:8px">Ek line = ek rule · <code>{checkin}</code> aur <code>{checkout}</code> automatically replace ho jaate hain</p>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_RULES}</div>
        <span class="section-title">Add-on Services</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label>Add-ons (one per line — <code>name | description | price</code>)</label>
          <textarea id="f-addons" rows="4" placeholder="Chef on demand | Indian cuisine | 1500\nAirport pickup | Sedan | 2500">${(p.addons || []).map(a => typeof a === 'string' ? a : [a.name||'', a.description||'', a.price != null ? a.price : ''].join(' | ').replace(/\\s*\\|\\s*$/,'')).join('\\n')}</textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_INFO}</div>
        <span class="section-title">👥 Owner & Caretaker <span class="hint" style="font-weight:400">(booking aate hi WhatsApp update jayega)</span></span>
      </div>
      <div class="section-body">
        <div class="field-grid">
          <div class="field">
            <label>Owner Name</label>
            <input type="text" id="f-owner-name" value="${esc(p.owner_name || '')}" placeholder="e.g. Ramesh ji"/>
          </div>
          <div class="field">
            <label>Owner WhatsApp Number</label>
            <input type="tel" id="f-owner-phone" value="${esc(p.owner_phone || '')}" placeholder="e.g. 9876543210"/>
          </div>
          <div class="field">
            <label>Caretaker Name</label>
            <input type="text" id="f-caretaker-name" value="${esc(p.caretaker_name || '')}" placeholder="e.g. Suresh"/>
          </div>
          <div class="field">
            <label>Caretaker WhatsApp Number</label>
            <input type="tel" id="f-caretaker-phone" value="${esc(p.caretaker_phone || '')}" placeholder="e.g. 9876543210"/>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-icon">${ICON_INFO}</div>
        <span class="section-title">Map & FOMO controls</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label>Google Maps URL</label>
          <input type="text" id="f-map-url" value="${esc(p.map_url || '')}" placeholder="https://maps.google.com/..."/>
        </div>
        <div class="field">
          <label>📍 Nearby Attractions <span class="hint">(manually add karo — property page pe dikhenge)</span></label>

function getRulesFromTextarea() {
  const val = document.getElementById('rules-textarea')?.value || '';
  return val.split('\n').map(s => s.trim()).filter(Boolean).map(text => {
    // Auto-detect icon from keywords
    const t = text.toLowerCase();
    let icon = 'info';
    if (t.includes('check-in')||t.includes('check in')||t.includes('checkout')||t.includes('check out')||t.includes('{checkin}')||t.includes('{checkout}')) icon = 'clock';
    else if (t.includes('smok')) icon = 'nosmoking';
    else if (t.includes('party')||t.includes('event')||t.includes('dj')||t.includes('music')) icon = 'party';
    else if (t.includes('pet')||t.includes('dog')||t.includes('cat')||t.includes('animal')) icon = 'pet';

    else if (t.includes('key')||t.includes('lock')||t.includes('access')) icon = 'key';
    return { icon, text };
  });

async function handleDeviceUpload(files) {
  const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) { setUploadStatus('No valid image files selected.', 'error'); return; }

  const slots = MAX_PHOTOS - images.length;
  if (slots <= 0) {
    setUploadStatus(`Maximum ${MAX_PHOTOS} photos reached. Remove some to add more.`, 'error');
    return;
  }

  const toUpload = imageFiles.slice(0, slots);
  const skipped  = imageFiles.length - toUpload.length;
  if (skipped > 0) setUploadStatus(`${toUpload.length} photos upload hogi (${skipped} skipped — limit)…`, 'uploading');

  const inp = document.getElementById('device-file-input');
  if (inp) inp.disabled = true;

  const token   = getToken();
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:5000/api'
    : 'https://staydekho-production.up.railway.app/api';

  /* ── Upload in batches of 5 so the request stays small ── */
  const BATCH = 5;
  const allUrls = [];

  try {
    for (let i = 0; i < toUpload.length; i += BATCH) {
      const batch = toUpload.slice(i, i + BATCH);
      const from  = i + 1;
      const to    = Math.min(i + BATCH, toUpload.length);
      setUploadStatus(`Uploading ${from}–${to} of ${toUpload.length} photos…`, 'uploading');

      const fd = new FormData();
      batch.forEach(f => fd.append('images', f));

      const res  = await fetch(`${apiBase}/uploads/images`, { method: 'POST', headers, body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);

      (data.urls || []).forEach(url => {
        allUrls.push(url);
        images.push({ url, cat: 'Exterior' });
      });
      renderImages(); // show each batch immediately as it finishes
    }

    setUploadStatus(`${allUrls.length} photo(s) uploaded! Niche categories change kar sakte ho.`, 'success');
    setTimeout(() => setUploadStatus(''), 5000);
  } catch (err) {
    setUploadStatus('Upload failed: ' + err.message, 'error');
  } finally {
    if (inp) { inp.disabled = false; inp.value = ''; }
  }
}

/* ── Photo drag-reorder handlers ───────────────── */
let _dragIdx = null;

// Sync all category inputs into the images array before any drag
function syncImageCategories() {
  document.querySelectorAll('.img-cat-input').forEach((inp, idx) => {
    if (images[idx]) images[idx].cat = inp.value;
  });
}

/* ── Auto-scroll while dragging near top/bottom edge ── */
let _scrollRaf = null;
function _startDragScroll(e) {
  const ZONE = 100;   // px from edge to trigger scroll
  const SPEED = 12;   // px per frame
  function step() {
    const y = e.clientY;
    if (y < ZONE)        window.scrollBy(0, -SPEED);
    else if (y > window.innerHeight - ZONE) window.scrollBy(0, SPEED);
    _scrollRaf = requestAnimationFrame(step);
  }
  if (_scrollRaf) cancelAnimationFrame(_scrollRaf);
  _scrollRaf = requestAnimationFrame(step);
}
function _stopDragScroll() {
  if (_scrollRaf) { cancelAnimationFrame(_scrollRaf); _scrollRaf = null; }
}

function onImgDragStart(e, i) {
  syncImageCategories();   // capture all typed-but-unsaved values first
  _dragIdx = i;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const items = document.querySelectorAll('.img-item');
    if (items[i]) items[i].classList.add('img-dragging');
  }, 0);
  document.addEventListener('dragover', _startDragScroll);
}
function onImgDragOver(e, i) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.img-item').forEach(el => el.classList.remove('img-drop-here'));
  if (i !== _dragIdx) {
    const items = document.querySelectorAll('.img-item');
    if (items[i]) items[i].classList.add('img-drop-here');
  }
}
function onImgDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget))
    e.currentTarget.classList.remove('img-drop-here');
}
function onImgDrop(e, i) {
  e.preventDefault();
  document.querySelectorAll('.img-item').forEach(el => el.classList.remove('img-drop-here'));
  if (_dragIdx === null || _dragIdx === i) return;
  const moved = images.splice(_dragIdx, 1)[0];
  images.splice(i, 0, moved);
  renderImages();
  toast('Photo order updated — click Save to keep changes', 'success');
}
function onImgDragEnd() {
  _stopDragScroll();
  document.removeEventListener('dragover', _startDragScroll);
  document.querySelectorAll('.img-item').forEach(el => {
    el.classList.remove('img-dragging', 'img-drop-here');
  });
  _dragIdx = null;
}

  const addonEl = document.getElementById('f-addons');
  const fomoBE  = document.getElementById('f-fomo-bookings');
  const fomoVE  = document.getElementById('f-fomo-viewers');
  const fomoEE  = document.getElementById('f-fomo-enabled');

  const body = {
    name:          document.getElementById('f-name').value.trim(),
    location:      document.getElementById('f-location').value.trim(),
    price:         parseInt(document.getElementById('f-price').value)||0,
    beds:          parseInt(document.getElementById('f-beds').value)||4,
    bathrooms:     parseInt(document.getElementById('f-bathrooms').value)||3,
    guests:        parseInt(document.getElementById('f-guests').value)||10,
    description:   document.getElementById('f-desc').value.trim(),
    checkin_time:  document.getElementById('f-checkin').value.trim(),
    checkout_time: document.getElementById('f-checkout').value.trim(),
    status:        currentStatus,
    amenities:     amenities.join(','),
    rules:         getRulesFromTextarea(),
    images,
    ...(mapEl   ? { map_url: mapEl.value.trim() } : {}),
    ...(addonEl ? { addons:  parseAddonsTextarea(addonEl.value) } : {}),
    ...(fomoBE  ? { fomo_bookings: fomoBE.value === '' ? null : Number(fomoBE.value) } : {}),
    ...(fomoVE  ? { fomo_viewers:  fomoVE.value === '' ? null : Number(fomoVE.value) } : {}),
    ...(fomoEE  ? { fomo_enabled:  fomoEE.checked } : {}),
    property_types: getSelectedTypes(),
    lat: document.getElementById('f-lat')?.value ? parseFloat(document.getElementById('f-lat').value) : null,
    lng: document.getElementById('f-lng')?.value ? parseFloat(document.getElementById('f-lng').value) : null,
    nearby_attractions: JSON.stringify(getNearbyAttractions()),
    owner_name:      document.getElementById('f-owner-name')?.value.trim()      || '',
    owner_phone:     document.getElementById('f-owner-phone')?.value.trim()     || '',
    caretaker_name:  document.getElementById('f-caretaker-name')?.value.trim()  || '',
    caretaker_phone: document.getElementById('f-caretaker-phone')?.value.trim() || '',
  };

  try {
    await api.updateProperty(propId, body);
    toast('Saved successfully!', 'success');
    setTimeout(() => { btn.disabled=false; btn.innerHTML=`${ICON_SAVE} Save All Changes`; }, 1200);
  } catch(e) {
    toast('Save failed: ' + e.message, 'error');
    btn.disabled=false;
    btn.innerHTML=`${ICON_SAVE} Save All Changes`;
  }
}

let _tt;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className='', 3000);
}

// HTML escape helper
function esc(s) {
  return String(s||'').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c];
  });
}

/* ── Category Chips ─────────────────────────────── */
const CAT_LIST = [
  'Exterior','Bedroom','Swimming Pool','Living Room','Bathroom',
  'Kitchen','Dining Area','Courtyard','Terrace','Parking','Outdoors','Others'
];

function buildCatChips() {
  const wrap = document.getElementById('main-cat-chips');
  if (!wrap) return;
  wrap.innerHTML = CAT_LIST.map(c =>
    `<button class="cat-chip" type="button" onclick="pickMainCat('${c}',this)">${c}</button>`
  ).join('');

  // Room sub-chips (up to 10 rooms)
  const roomRow = document.getElementById('room-sub-row');
  if (roomRow) roomRow.innerHTML = Array.from({length:10},(_,i)=>
    `<button class="sub-chip" type="button" onclick="pickSubCat('Room ${i+1}',this,'room-sub-row')">Room ${i+1}</button>`
  ).join('');

  // Bathroom sub-chips (up to 6)
  const bathRow = document.getElementById('bath-sub-row');
  if (bathRow) bathRow.innerHTML = Array.from({length:6},(_,i)=>
    `<button class="sub-chip" type="button" onclick="pickSubCat('Bathroom ${i+1}',this,'bath-sub-row')">Bathroom ${i+1}</button>`
  ).join('');
}

function pickMainCat(cat, el) {
  document.querySelectorAll('#main-cat-chips .cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const roomRow = document.getElementById('room-sub-row');
  const bathRow = document.getElementById('bath-sub-row');
  roomRow.style.display = cat === 'Bedroom'  ? 'flex' : 'none';
  bathRow.style.display = cat === 'Bathroom' ? 'flex' : 'none';
  // Reset sub-chip active
  roomRow.querySelectorAll('.sub-chip').forEach(c => c.classList.remove('active'));
  bathRow.querySelectorAll('.sub-chip').forEach(c => c.classList.remove('active'));
  if (cat === 'Bedroom') {
    document.getElementById('new-img-cat').value = 'Room 1';
    roomRow.querySelector('.sub-chip')?.classList.add('active');
  } else if (cat === 'Bathroom') {
    document.getElementById('new-img-cat').value = 'Bathroom 1';
    bathRow.querySelector('.sub-chip')?.classList.add('active');
  } else {
    document.getElementById('new-img-cat').value = cat;
  }
}

function pickSubCat(val, el, rowId) {
  document.querySelectorAll(`#${rowId} .sub-chip`).forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('new-img-cat').value = val;
}

buildCatChips();

// ── NEARBY ATTRACTIONS EDITOR ──────────────────────────
const NEARBY_ICONS = ['📍','🏰','🏯','🛕','🕌','⛪','💧','🌊','🏖️','🌸','🌳','🌿','🏛️','💦','⛰️','🦁','🛍️','🏊','🏗️','🎡','🔭','🚤','🚡','🌺','🏔️'];

function addNearbyRow(data = {}) {
  const list = document.getElementById('nearby-list');
  const idx  = list.children.length;
  const div  = document.createElement('div');
  div.dataset.idx = idx;
  div.style.cssText = 'display:flex;gap:8px;align-items:center;background:#f9fafb;padding:10px;border-radius:8px;border:1px solid #e5e7eb';

  // Icon selector
  const iconSel = document.createElement('select');
  iconSel.style.cssText = 'width:60px;padding:6px 4px;border:1px solid #e5e7eb;border-radius:6px;font-size:16px;text-align:center';
  NEARBY_ICONS.forEach(ic => {
    const opt = document.createElement('option');
    opt.value = ic; opt.textContent = ic;
    if (ic === (data.icon || '📍')) opt.selected = true;
    iconSel.appendChild(opt);
  });
  div.appendChild(iconSel);

  // Name input
  const nameIn = document.createElement('input');
  nameIn.type = 'text'; nameIn.placeholder = 'Place name (e.g. City Palace)';
  nameIn.value = data.name || '';
  nameIn.style.cssText = 'flex:1;padding:7px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px';
  div.appendChild(nameIn);

  // Distance
  const distIn = document.createElement('input');
  distIn.type = 'text'; distIn.placeholder = 'Distance (e.g. 3.2 km)';
  distIn.value = data.dist || '';
  distIn.style.cssText = 'width:110px;padding:7px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px';
  div.appendChild(distIn);

  // Time
  const timeIn = document.createElement('input');
  timeIn.type = 'text'; timeIn.placeholder = 'Time (e.g. 12 min)';
  timeIn.value = data.time || '';
  timeIn.style.cssText = 'width:100px;padding:7px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px';
  div.appendChild(timeIn);

  // Remove button
  const rmBtn = document.createElement('button');
  rmBtn.type = 'button'; rmBtn.textContent = '✕';
  rmBtn.style.cssText = 'width:30px;height:30px;border:none;background:#fee2e2;color:#dc2626;border-radius:6px;cursor:pointer;font-size:14px;flex-shrink:0';
  rmBtn.onclick = () => div.remove();
  div.appendChild(rmBtn);

  list.appendChild(div);
}

function getNearbyAttractions() {
  return Array.from(document.getElementById('nearby-list')?.children || []).map(row => {
    const inputs = row.querySelectorAll('input, select');
    return {
      icon: inputs[0]?.value || '📍',
      name: inputs[1]?.value?.trim() || '',
      dist: inputs[2]?.value?.trim() || '',
      time: inputs[3]?.value?.trim() || '',
    };
  }).filter(r => r.name);
}

function loadNearbyEditor(attractions) {
  const list = document.getElementById('nearby-list');
  if (!list) return;
  list.innerHTML = '';
  (attractions || []).forEach(a => addNearbyRow(a));
}
</script>

<!-- Leaflet.js Map Picker -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let _mapPicker = null, _mapMarker = null;

function initMapPicker(lat, lng) {
  const el = document.getElementById('prop-map-picker');
  if (!el || _mapPicker) return;

  const defLat = lat || 24.5854;  // India center
  const defLng = lng || 73.7125;
  const zoom   = lat ? 14 : 5;

  _mapPicker = L.map('prop-map-picker').setView([defLat, defLng], zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(_mapPicker);

  // Show existing pin if coordinates saved
  if (lat && lng) {
    _mapMarker = L.marker([lat, lng]).addTo(_mapPicker)
      .bindPopup('Property location').openPopup();
  }

  // Click on map → set pin + fill lat/lng inputs
  _mapPicker.on('click', function(e) {
    const { lat, lng } = e.latlng;
    document.getElementById('f-lat').value = lat.toFixed(6);
    document.getElementById('f-lng').value = lng.toFixed(6);
    if (_mapMarker) _mapPicker.removeLayer(_mapMarker);
    _mapMarker = L.marker([lat, lng]).addTo(_mapPicker)
      .bindPopup('📍 Property location').openPopup();
  });
}

async function searchMapLocation() {
  const loc = document.getElementById('f-location')?.value?.trim();
  if (!loc) return alert('Pehle location field mein location type karo');
  try {
    const res  = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(loc)}&format=json&limit=1`);
    const data = await res.json();
    if (!data.length) return alert('Location nahi mili. Thoda aur specific likho.');
    const lat = parseFloat(data[0].lat);
    const lng = parseFloat(data[0].lon);
    document.getElementById('f-lat').value = lat.toFixed(6);
    document.getElementById('f-lng').value = lng.toFixed(6);
    if (_mapPicker) {
      _mapPicker.setView([lat, lng], 14);
      if (_mapMarker) _mapPicker.removeLayer(_mapMarker);
      _mapMarker = L.marker([lat, lng]).addTo(_mapPicker)
        .bindPopup('📍 ' + data[0].display_name).openPopup();
    }
  } catch(e) { alert('Search failed: ' + e.message); }
}

// Init map when Settings section is visible (lazy load)
const _mapObs = new MutationObserver(() => {
  const el = document.getElementById('prop-map-picker');
  if (el && el.offsetParent !== null && !_mapPicker) {
    const lat = parseFloat(document.getElementById('f-lat')?.value || '');
    const lng = parseFloat(document.getElementById('f-lng')?.value || '');
    initMapPicker(lat || null, lng || null);
    _mapObs.disconnect();
  }
});
_mapObs.observe(document.body, { childList: true, subtree: true, attributes: true });

// Also init when page fully loads in case map is visible
window.addEventListener('load', () => {
  setTimeout(() => {
    if (!_mapPicker) {
      const lat = parseFloat(document.getElementById('f-lat')?.value || '');
      const lng = parseFloat(document.getElementById('f-lng')?.value || '');
      initMapPicker(lat || null, lng || null);
    }
  }, 800);
});
</script>
