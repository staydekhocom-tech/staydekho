<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Property — StayDekho</title>

  <!-- SEO / OG — filled by JS after load -->
  <meta name="description" content="Premium group stay — StayDekho"/>
  <meta property="og:site_name" content="StayDekho"/>
  <meta property="og:type" content="website"/>
  <meta id="og-title"       property="og:title"       content="StayDekho"/>
  <meta id="og-description" property="og:description" content="Premium group stay — StayDekho"/>
  <meta id="og-image"       property="og:image"       content=""/>
  <meta id="og-url"         property="og:url"         content=""/>

  <link rel="icon" type="image/png" href="images/favicon.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:site" content="@staydekho"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <style>
  /* ═══════════════════════════════════════════
     BLACK-SCREEN BUG FIX — overscroll, stacking, safety
  ═══════════════════════════════════════════ */
  html, body { background: #ffffff !important; }
  /* iOS Safari overscroll glow shows the document's base color, which used
     to inherit from the dark navbar's stacking context. Force white. */
  body { background-color: #ffffff; }
  /* The lightbox + category gallery + mobile bk panel are fixed/inset:0 with
     dark backgrounds. Some browsers were briefly painting them while scrolling
     past the About section due to a stale `display` value. Force-hide when
     they don't have the `.open` class. */
  #lightbox:not(.open), #cat-gallery-modal:not(.open) { display: none !important; }
  /* Establish a stable stacking context for the article body so a child
     iframe (Google Maps) can never paint over later sections. */
  .prop-layout { position: relative; z-index: 1; isolation: isolate; }
  .prop-section { position: relative; z-index: 1; background: #fff; }
  .map-wrap, .map-wrap iframe { background: #fff; }

  /* ═══════════════════════════════════════════
     NAV — always white on property page (no dark hero)
  ═══════════════════════════════════════════ */
  #navbar.nav-top .nav-inner {
    background: rgba(255,255,255,.96) !important;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(139,23,23,.08);
    box-shadow: 0 2px 18px rgba(0,0,0,.06);
  }
  #navbar.nav-top .nav-links a { color: var(--gray-600) !important; }
  #navbar.nav-top .nav-links a:hover { color: var(--red) !important; background: var(--red-light) !important; }
  #navbar.nav-top .logo-stay, #navbar.nav-top .logo-dekh { color: var(--red) !important; }
  #navbar.nav-top .logo-o svg circle.lens { stroke: var(--red) !important; }
  #navbar.nav-top .logo-o svg line.handle { stroke: var(--red) !important; }
  #navbar.nav-top .nav-login { color: var(--gray-600) !important; border-color: var(--gray-200) !important; }
  #navbar.nav-top .nav-hamburger span { background: var(--dark) !important; }

  /* ═══════════════════════════════════════════
     SKELETON LOADER
  ═══════════════════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: -700px 0; }
    100% { background-position:  700px 0; }
  }
  .sk {
    background: linear-gradient(90deg,#f0ece8 25%,#e8e4e0 50%,#f0ece8 75%);
    background-size: 700px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 10px;
  }
  .sk-gallery {
    display: grid; grid-template-columns: 1.6fr 1fr;
    grid-template-rows: 240px 185px; gap: 6px;
    border-radius: 16px; overflow: hidden; margin-bottom: 16px;
  }
  .sk-gallery .sk-main { grid-row: 1/3; border-radius: 0; }
  .sk-gallery .sk-thumb { border-radius: 0; }
  .sk-title  { height: 36px; width: 55%; margin-bottom: 12px; }
  .sk-meta   { height: 18px; width: 40%; margin-bottom: 28px; }
  .sk-stats  { height: 80px; border-radius: 14px; margin-bottom: 32px; }
  .sk-para   { height: 14px; margin-bottom: 8px; }
  .sk-para:last-child { width: 70%; }

  /* ═══════════════════════════════════════════
     GALLERY
  ═══════════════════════════════════════════ */
  .gallery-wrap {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    grid-template-rows: 240px 185px;
    gap: 6px; border-radius: 16px; overflow: hidden;
    position: relative; margin-bottom: 16px;
  }
  .gallery-wrap img {
    width: 100%; height: 100%; object-fit: cover; cursor: pointer;
    transition: filter .25s;
  }
  .gallery-wrap img:hover { filter: brightness(.88); }
  .gallery-main { grid-row: 1/3; }
  /* Only 2 thumbs shown on desktop grid (2 rows right col) */
  .gallery-thumb:nth-child(n+4) { display: none; }
  .gallery-show-btn {
    position: absolute; bottom: 16px; right: 16px;
    background: #fff; border: 1.5px solid #e0dbd5;
    border-radius: 10px; padding: 9px 18px;
    font-size: .82rem; font-weight: 700; cursor: pointer; color: #1a0a0a;
    display: flex; align-items: center; gap: 7px;
    transition: box-shadow .2s, background .2s;
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
  }
  .gallery-show-btn:hover { background: #f5f0eb; box-shadow: 0 4px 18px rgba(0,0,0,.14); }

  /* ═══════════════════════════════════════════
     CATEGORY CHIPS (below gallery)
  ═══════════════════════════════════════════ */
  .cat-tabs {
    display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
    padding: 10px 0 18px; scrollbar-width: none; -ms-overflow-style: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    padding: 7px 15px; border-radius: 24px; border: 1.5px solid var(--gray-200);
    background: #fff; font-size: .8rem; font-weight: 600; cursor: pointer;
    transition: all .18s; color: var(--dark); flex-shrink: 0;
  }
  .cat-chip:hover { border-color: var(--dark); background: #faf8f5; }
  .cat-chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }
  .cat-chip-count { font-size: .72rem; font-weight: 500; opacity: .65; }

  /* ═══════════════════════════════════════════
     CATEGORY GALLERY MODAL
  ═══════════════════════════════════════════ */
  #cat-gallery-modal {
    display: none; position: fixed; inset: 0;
    background: #fff; z-index: 100000; overflow-y: auto;
  }
  #cat-gallery-modal.open { display: block; }
  .cg-header {
    position: sticky; top: 0; background: #fff; z-index: 10;
    padding: 14px 28px; border-bottom: 1px solid #ede9e4;
    display: flex; align-items: center; gap: 14px;
  }
  .cg-close {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--gray-200);
    background: #fff; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 1.3rem; line-height: 1; flex-shrink: 0;
    transition: background .18s; color: var(--dark); font-weight: 300;
  }
  .cg-close:hover { background: #f5f0eb; }
  .cg-modal-title { font-weight: 800; font-size: 1rem; white-space: nowrap; flex-shrink: 0; }
  .cg-cat-tabs {
    display: flex; gap: 8px; overflow-x: auto; flex: 1;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .cg-cat-tabs::-webkit-scrollbar { display: none; }
  .cg-body { padding: 28px; }
  .cg-section { margin-bottom: 36px; }
  .cg-section-title {
    font-size: .78rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: var(--gray-400); margin-bottom: 14px;
  }
  .cg-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .cg-grid img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px;
    cursor: pointer; display: block; transition: opacity .2s;
  }
  .cg-grid img:hover { opacity: .88; }
  .cg-empty { text-align: center; padding: 60px; color: var(--gray-400); font-size: .95rem; }
  @media (max-width: 900px) {
    .cg-grid { grid-template-columns: repeat(2, 1fr); }
    .cg-body  { padding: 18px; }
  }
  @media (max-width: 600px) {
    .cg-grid { grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .cg-header { padding: 12px 16px; gap: 10px; }
    .cg-body   { padding: 14px; }
  }

  /* ═══════════════════════════════════════════
     LIGHTBOX
  ═══════════════════════════════════════════ */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.95); z-index: 99999;
    align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img  { max-width: 88vw; max-height: 88vh; border-radius: 10px; object-fit: contain; }
  .lb-close {
    position: fixed; top: 20px; right: 26px; color: #fff; font-size: 2rem;
    cursor: pointer; background: none; border: none; font-weight: 300;
    line-height: 1; opacity: .8; transition: opacity .2s;
  }
  .lb-close:hover { opacity: 1; }
  .lb-arrow {
    position: fixed; top: 50%; transform: translateY(-50%); color: #fff;
    font-size: 2.2rem; cursor: pointer; background: rgba(255,255,255,.1);
    border: none; padding: 12px 18px; border-radius: 50%;
    transition: background .2s; line-height: 1;
  }
  .lb-arrow:hover { background: rgba(255,255,255,.2); }
  .lb-prev { left: 20px; } .lb-next { right: 20px; }
  .lb-counter {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.7); font-size: .85rem;
  }

  /* ═══════════════════════════════════════════
     TITLE ROW
  ═══════════════════════════════════════════ */
  .prop-title-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .prop-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(1.6rem,3vw,2.1rem); color: var(--dark); margin: 0 0 8px;
  }
  .prop-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: .88rem; color: var(--gray-500); flex-wrap: wrap;
  }
  .prop-meta .sep { color: var(--gray-200); }
  .prop-meta .loc { display: inline-flex; align-items: center; gap: 4px; color: var(--gray-500); }
  .prop-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ═══════════════════════════════════════════
     QUICK STATS
  ═══════════════════════════════════════════ */
  .quick-stats {
    display: flex; align-items: stretch;
    border: 1px solid var(--gray-200); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 32px;
  }
  .qs-item { flex: 1; padding: 18px 20px; text-align: center; border-right: 1px solid var(--gray-200); }
  .qs-item:last-child { border-right: none; }
  .qs-val { font-size: 1.1rem; font-weight: 800; color: var(--dark); margin-bottom: 3px; }
  .qs-lbl { font-size: .72rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

  /* ═══════════════════════════════════════════
     CONTENT SECTIONS
  ═══════════════════════════════════════════ */
  .prop-section { margin-bottom: 36px; padding-bottom: 36px; border-bottom: 1px solid var(--gray-100); }
  .prop-section:last-child { border-bottom: none; }
  .prop-section h3 { font-size: 1.15rem; font-weight: 800; margin: 0 0 16px; }
  .prop-section p  { color: var(--gray-600); line-height: 1.8; font-size: .95rem; margin: 0; }

  /* ═══════════════════════════════════════════
     AMENITIES
  ═══════════════════════════════════════════ */
  .amenities-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .amenity-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--gray-200);
    border-radius: 10px; font-size: .88rem; font-weight: 500;
    transition: border-color .2s, background .2s;
  }
  .amenity-item:hover { border-color: var(--red); background: #fff8f8; }
  .amenity-icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--red); }
  .amenity-icon svg { width: 20px; height: 20px; display: block; }

  /* ═══════════════════════════════════════════
     REVIEWS
  ═══════════════════════════════════════════ */
  .reviews-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px; }
  .review-card {
    background: var(--off-white); border-radius: var(--radius-sm);
    padding: 18px; border: 1px solid var(--gray-100);
  }
  .review-stars { color: #D4A017; font-size: 1rem; margin-bottom: 10px; letter-spacing: 2px; }
  .review-text  { font-size: .88rem; color: var(--gray-600); line-height: 1.7; margin-bottom: 14px; }
  .review-author { display: flex; align-items: center; gap: 10px; }
  .review-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .9rem; flex-shrink: 0;
  }
  .review-name { font-weight: 700; font-size: .85rem; }
  .review-date { font-size: .75rem; color: var(--gray-400); }

  /* ── Review submit form ── */
  .review-form {
    margin-top: 24px; padding: 20px; background: #fff;
    border: 1.5px solid var(--gray-200); border-radius: 14px;
  }
  .review-form h4 { font-size: .95rem; font-weight: 800; margin: 0 0 14px; }
  .star-picker { display: flex; gap: 6px; margin-bottom: 14px; }
  .star-picker span {
    font-size: 1.6rem; cursor: pointer; color: #ccc;
    transition: color .15s, transform .15s; line-height: 1;
  }
  .star-picker span.active { color: #D4A017; }
  .star-picker span:hover  { transform: scale(1.15); color: #D4A017; }
  .review-textarea {
    width: 100%; min-height: 80px; border: 1.5px solid var(--gray-200);
    border-radius: 10px; padding: 10px 13px; font-family: inherit;
    font-size: .88rem; resize: vertical; outline: none;
    transition: border-color .2s; box-sizing: border-box;
  }
  .review-textarea:focus { border-color: var(--red); }

  /* ═══════════════════════════════════════════
     LAYOUT (desktop 70 / 30)
  ═══════════════════════════════════════════ */
  .prop-layout { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 44px; align-items: start; }
  .prop-sticky { position: sticky; top: 90px; }

  /* ═══════════════════════════════════════════
     BOOKING WIDGET
  ═══════════════════════════════════════════ */
  .bk-widget {
    background: #fff; border: 1.5px solid #e0dbd5; border-radius: 22px;
    padding: 28px; box-shadow: 0 8px 40px rgba(0,0,0,.10);
  }
  .bk-price { font-size: 1.6rem; font-weight: 800; color: var(--dark); }
  .bk-price span { font-size: .95rem; font-weight: 500; color: var(--gray-400); }
  .bk-rating { font-size: .85rem; color: var(--gray-500); margin: 4px 0 20px; display: flex; align-items: center; gap: 5px; }
  .bk-dates {
    display: grid; grid-template-columns: 1fr 1fr;
    border: 1.5px solid #e0dbd5; border-radius: 12px; overflow: hidden; margin-bottom: 0;
  }
  .bk-date-field { padding: 12px 14px; cursor: pointer; transition: background .15s; }
  .bk-date-field:first-child { border-right: 1px solid #e0dbd5; }
  .bk-date-field:hover { background: #faf8f5; }
  .bk-date-field label {
    display: block; font-size: .62rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: .1em; color: var(--dark); margin-bottom: 4px; cursor: pointer;
  }
  .bk-date-field input {
    border: none; outline: none; font-family: inherit; font-size: .9rem;
    color: var(--gray-600); background: transparent; width: 100%; cursor: pointer;
  }
  .bk-guests {
    border: 1.5px solid #e0dbd5; border-top: none; border-radius: 0 0 12px 12px;
    padding: 12px 14px; cursor: pointer; margin-bottom: 16px; transition: background .15s;
  }
  .bk-guests:hover { background: #faf8f5; }
  .bk-guests label { display: block; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--dark); margin-bottom: 4px; }
  .bk-guests-row { display: flex; align-items: center; justify-content: space-between; }
  .bk-guest-count { font-size: .9rem; color: var(--gray-600); font-weight: 500; }
  .bk-guest-btns  { display: flex; align-items: center; gap: 12px; }
  .bk-guest-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #e0dbd5;
    background: #fff; font-size: 1.1rem; display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: all .15s;
    font-weight: 700; color: var(--dark); line-height: 1;
  }
  .bk-guest-btn:hover   { border-color: var(--dark); }
  .bk-guest-btn:disabled { opacity: .35; cursor: not-allowed; }
  .bk-breakdown { margin: 16px 0; }
  .bk-row { display: flex; justify-content: space-between; font-size: .88rem; color: var(--gray-600); padding: 6px 0; }
  .bk-row.total { border-top: 1px solid var(--gray-200); margin-top: 6px; padding-top: 12px; font-size: .95rem; font-weight: 800; color: var(--dark); }
  .bk-note { font-size: .75rem; color: var(--gray-400); text-align: center; margin-top: 10px; line-height: 1.5; }
  .bk-wa-btn {
    width: 100%; background: #25D366; color: #fff; border: none; border-radius: 14px;
    padding: 13px 20px; font-weight: 700; font-size: .88rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px; transition: background .2s;
  }
  .bk-wa-btn:hover { background: #1da851; }

  /* ═══════════════════════════════════════════
     HOST CARD
  ═══════════════════════════════════════════ */
  .host-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
  .host-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem; flex-shrink: 0;
  }

  /* ═══════════════════════════════════════════
     MAP SECTION
  ═══════════════════════════════════════════ */
  .map-wrap {
    border-radius: 14px; overflow: hidden; height: 280px;
    border: 1px solid var(--gray-200);
  }
  .map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ═══════════════════════════════════════════
     SIMILAR PROPERTIES
  ═══════════════════════════════════════════ */
  .similar-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
  .sim-card {
    border: 1px solid var(--gray-200); border-radius: 16px; overflow: hidden;
    transition: box-shadow .2s, transform .2s; cursor: pointer; background: #fff;
    text-decoration: none; color: inherit; display: block;
  }
  .sim-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.12); transform: translateY(-3px); }
  .sim-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .sim-card-body { padding: 14px; }
  .sim-card-title { font-weight: 700; font-size: .9rem; margin-bottom: 4px; color: var(--dark); }
  .sim-card-loc   { font-size: .78rem; color: var(--gray-400); margin-bottom: 6px; }
  .sim-card-price { font-size: .9rem; font-weight: 800; color: var(--red); }
  .sim-card-price span { font-weight: 400; color: var(--gray-400); font-size: .75rem; }

  /* ═══════════════════════════════════════════
     TOAST
  ═══════════════════════════════════════════ */
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1a0a0a; color: #fff;
    padding: 12px 24px; border-radius: 28px;
    font-size: .85rem; font-weight: 600;
    z-index: 99998; opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: #1b5e20; }
  #toast.error   { background: #b71c1c; }


  /* ═══════════════════════════════════════════
     MOBILE BOOKING SHEET
  ═══════════════════════════════════════════ */
  #mob-sheet-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 10000; transition: opacity .3s;
  }
  #mob-sheet-overlay.open { display: block; }
  #mob-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10001;
    background: #fff; border-radius: 24px 24px 0 0;
    padding: 24px 20px 32px; transform: translateY(100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  }
  #mob-sheet.open { transform: translateY(0); }
  .mob-sheet-handle {
    width: 40px; height: 4px; background: #ddd; border-radius: 4px;
    margin: 0 auto 20px; display: block;
  }
  .mob-sheet-title { font-size: 1rem; font-weight: 800; margin-bottom: 18px; }
  .mob-sheet-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mob-date-field {
    border: 1.5px solid #e0dbd5; border-radius: 12px; padding: 12px 14px;
  }
  .mob-date-field label { display: block; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--dark); margin-bottom: 4px; }
  .mob-date-field input { border: none; outline: none; font-family: inherit; font-size: .9rem; color: var(--gray-600); background: transparent; width: 100%; }
  .mob-guests-row {
    border: 1.5px solid #e0dbd5; border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
  }
  .mob-guests-row label { font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--dark); display: block; margin-bottom: 2px; }
  .mob-sheet-total { font-size: .85rem; color: var(--gray-500); margin-bottom: 18px; text-align: center; }
  .mob-sheet-total strong { color: var(--dark); }

  /* ── Calendar Picker — Airbnb-style two-month range ── */
  .cal-overlay { position:fixed;inset:0;z-index:10090;background:rgba(0,0,0,.45); }
  .cal-popup {
    position:fixed;z-index:10091;background:#fff;border-radius:20px;
    box-shadow:0 12px 48px rgba(0,0,0,.28);padding:0;
    width:min(680px,calc(100vw - 20px));
    left:50%;top:50%;transform:translate(-50%,-50%);
    user-select:none;overflow:hidden;max-height:92vh;overflow-y:auto;
  }
  /* Step pills — show which date is being picked */
  .cal-step-hdr { display:flex;gap:10px;padding:16px 20px 14px;border-bottom:1.5px solid #f3f4f6; }
  .cal-step-pill {
    flex:1;border:2px solid #e5e7eb;border-radius:12px;padding:10px 14px;
    cursor:pointer;background:#fff;transition:border-color .15s,background .15s;
  }
  .cal-step-pill.active { border-color:#8B1717;background:#fff9f9; }
  .cal-step-pill > label { display:block;font-size:.6rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;cursor:inherit; }
  .cal-pill-val { font-size:.88rem;font-weight:600;color:#111; }
  .cal-pill-val.empty { color:#9ca3af;font-weight:400; }
  /* Month nav */
  .cal-nav { display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px; }
  .cal-nav-btn { background:none;border:1.5px solid #e5e7eb;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;color:#374151;transition:background .15s;flex-shrink:0; }
  .cal-nav-btn:hover { background:#f3f4f6; }
  /* Two months side by side */
  .cal-months-row { display:flex;gap:0;padding:0 16px 12px; }
  .cpop-month-col { flex:1;min-width:0;padding:0 6px; }
  .cpop-month-lbl { font-weight:800;font-size:.82rem;color:#111;text-align:center;padding:6px 0 10px; }
  .cpop-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:2px; }
  .cpop-dow { text-align:center;font-size:.56rem;font-weight:700;color:#9ca3af;padding:3px 0;text-transform:uppercase; }
  .cal-months-sep { width:1px;background:#f3f4f6;flex-shrink:0;margin:0 4px; }
  /* Day cells */
  .cal-day {
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:50%;font-size:.76rem;cursor:pointer;transition:background .08s;
    font-weight:500;color:#111;position:relative;
  }
  .cal-day.other-m { visibility:hidden;pointer-events:none; }
  .cal-day.disabled { opacity:.3;cursor:not-allowed;pointer-events:none; }
  .cal-day.booked-d { background:#fee2e2;color:#b91c1c;cursor:not-allowed;pointer-events:none;text-decoration:line-through;opacity:.6; }
  .cal-day:not(.disabled):not(.booked-d):not(.other-m):not(.sel-ci):not(.sel-co):hover { background:#f3f4f6; }
  .cal-day.in-range { background:#fff1f1;border-radius:0; }
  .cal-day.range-edge-l { border-radius:50% 0 0 50% !important; }
  .cal-day.range-edge-r { border-radius:0 50% 50% 0 !important; }
  .cal-day.sel-ci,.cal-day.sel-co { background:#8B1717 !important;color:#fff !important;border-radius:50% !important;font-weight:700; }
  .cal-day.today-d:not(.sel-ci):not(.sel-co) { font-weight:800;color:#8B1717; }
  /* Hint & actions */
  .cal-hint { text-align:center;font-size:.75rem;color:#6b7280;padding:4px 20px 10px;min-height:20px;font-weight:500; }
  .cal-actions { display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid #f3f4f6; }
  .cal-clear-btn { background:none;border:none;cursor:pointer;font-family:inherit;font-size:.8rem;color:#6b7280;text-decoration:underline;padding:4px; }
  .cal-done-btn { background:#8B1717;color:#fff;border:none;border-radius:10px;padding:9px 24px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit; }
  /* Date display in booking widget */
  .bk-date-display { font-size:.88rem;color:#374151;font-weight:500;min-height:20px; }
  .bk-date-display.empty { color:#9ca3af; }
  .bk-date-field.cal-active { background:#fff9f9;outline:2px solid #8B1717;outline-offset:-2px;border-radius:inherit; }
  .mob-date-display { font-size:.88rem;color:#374151;font-weight:500; }
  .mob-date-display.empty { color:#9ca3af; }
  /* Mobile: single month only */
  @media(max-width:560px){
    .cal-popup { width:calc(100vw - 16px); }
    .cpop-month-col:last-child,.cal-months-sep { display:none; }
  }

  /* ═══════════════════════════════════════════
     RULES LIST + BREADCRUMB
  ═══════════════════════════════════════════ */
  .rules-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .rules-list li { display: flex; align-items: center; gap: 12px; font-size: .88rem; color: var(--gray-600); line-height: 1.5; }
  .rule-icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--red); }
  .rule-icon svg { width: 18px; height: 18px; display: block; }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--gray-400); margin-bottom: 20px; flex-wrap: wrap; }
  .breadcrumb a { color: var(--gray-400); transition: color .2s; }
  .breadcrumb a:hover { color: var(--red); }

  /* ═══════════════════════════════════════════
     RESPONSIVE
  ═══════════════════════════════════════════ */
  @media (max-width: 1000px) {
    .prop-layout { grid-template-columns: 1fr; }
    .prop-sticky { display: none; }
.gallery-wrap { grid-template-columns: 1fr 1fr; grid-template-rows: 220px 220px; }
    .gallery-main { grid-row: 1; grid-column: 1/3; }
    .gallery-wrap .gallery-thumb:nth-child(3) { display: none; }
    .gallery-wrap .gallery-thumb:nth-child(4) { display: none; }
    .amenities-grid { grid-template-columns: 1fr 1fr; }
    .reviews-grid   { grid-template-columns: 1fr; }
    .similar-grid   { grid-template-columns: 1fr 1fr; }
    .sk-gallery { grid-template-columns: 1fr 1fr; grid-template-rows: 220px 220px; }
    .sk-gallery .sk-main { grid-row: 1; grid-column: 1/3; }
  }
  @media (max-width: 600px) {
    .gallery-wrap { grid-template-columns: 1fr; grid-template-rows: 260px; border-radius: 14px; }
    .gallery-wrap .gallery-thumb { display: none; }
    .gallery-main { grid-row: 1; grid-column: 1; }
    .prop-title { font-size: 1.5rem; }
    .quick-stats { flex-wrap: wrap; }

    .amenities-grid { grid-template-columns: 1fr; }
    .similar-grid   { grid-template-columns: 1fr; }
    .sk-gallery { grid-template-columns: 1fr; grid-template-rows: 260px; }
    .sk-gallery .sk-thumb { display: none; }
    .sk-gallery .sk-main  { grid-row: 1; grid-column: 1; }
  }
  /* ── Urgency strip ─────────────────────────── */
  .urgency-strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    padding:10px 14px;background:#fff9f0;border-radius:10px;
    border:1.5px solid #fed7aa;margin-bottom:18px;}
  .urgency-item{display:inline-flex;align-items:center;gap:5px;font-size:.79rem;color:#92400e;font-weight:600;}
  .urgency-item strong{color:#78350f;}

  /* ── Trust badges ───────────────────────────── */
  .trust-strip{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 0;border-top:1px solid var(--gray-100);margin-top:10px;}
  .trust-item{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--gray-600);font-weight:600;background:var(--gray-50);padding:5px 10px;border-radius:20px;}

  /* ── What's Included ────────────────────────── */
  .included-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .included-item{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:14px 10px;border-radius:12px;border:1.5px solid var(--gray-100);background:var(--gray-50);text-align:center;}
  .included-icon{font-size:1.4rem;}
  .included-val{font-size:.87rem;font-weight:800;color:var(--dark);}
  .included-lbl{font-size:.68rem;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}

  /* ── Availability Calendar ──────────────────── */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav-btn{width:30px;height:30px;border:1.5px solid var(--gray-200);border-radius:8px;
    background:#fff;cursor:pointer;font-size:1.1rem;color:var(--gray-500);
    display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .cal-nav-btn:hover{border-color:var(--red);color:var(--red);}
  .cal-month-name{font-weight:800;font-size:.9rem;color:var(--dark);}
  .cal-two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .cal-month-title{font-size:.8rem;font-weight:700;color:var(--gray-600);text-align:center;margin-bottom:7px;}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:3px;}
  .cal-dow{text-align:center;font-size:.63rem;font-weight:700;color:var(--gray-400);padding:3px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:.73rem;border-radius:6px;font-weight:500;cursor:pointer;transition:all .12s;color:var(--gray-700);}
  .cal-cell.cal-empty{cursor:default;}
  .cal-cell.cal-past{color:var(--gray-300);cursor:default;}
  .cal-cell.cal-booked{background:#fef2f2;color:#fca5a5;cursor:not-allowed;text-decoration:line-through;font-size:.66rem;}
  .cal-cell.cal-avail:hover{background:var(--red-light);color:var(--red);}
  .cal-cell.cal-today{font-weight:900;color:var(--red);}
  .cal-cell.cal-ci,.cal-cell.cal-co{background:var(--red)!important;color:#fff!important;font-weight:800;border-radius:8px!important;}
  .cal-cell.cal-range{background:var(--red-light);color:var(--red);border-radius:0;}
  .cal-cell.cal-ci{border-radius:8px 0 0 8px!important;}
  .cal-cell.cal-co{border-radius:0 8px 8px 0!important;}
  .cal-cell.cal-hover-range{background:var(--red-light);color:var(--red);border-radius:0;}
  .cal-cell.cal-hover-co{background:rgba(139,23,23,.18);color:var(--red);border-radius:0 8px 8px 0;font-weight:700;}
  .cal-legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .cal-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;color:var(--gray-500);}
  .cal-leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cal-leg-avail{background:var(--gray-100);}
  .cal-leg-booked{background:#fecaca;}
  .cal-leg-sel{background:var(--red);}
  @media(max-width:600px){.cal-two-col{grid-template-columns:1fr;}.cal-two-col .cal-month-block:last-child{display:none;}}

  /* ── Nearby Attractions ─────────────────────── */
  .nearby-grid{display:flex;flex-direction:column;gap:8px;}
  .nearby-item{display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:12px;border:1.5px solid var(--gray-100);background:var(--gray-50);}
  .nearby-icon{font-size:1.2rem;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;
    justify-content:center;background:#fff;border-radius:9px;border:1px solid var(--gray-100);}
  .nearby-name{font-size:.84rem;font-weight:700;color:var(--gray-700);}
  .nearby-dist{font-size:.71rem;color:var(--gray-400);margin-top:1px;}
  .nearby-badge{margin-left:auto;font-size:.69rem;padding:3px 9px;border-radius:20px;
    background:var(--red-light);color:var(--red);font-weight:700;white-space:nowrap;flex-shrink:0;}

  /* ── FAQ ────────────────────────────────────── */
  .faq-list{display:flex;flex-direction:column;gap:8px;}
  .faq-item{border:1.5px solid var(--gray-100);border-radius:12px;overflow:hidden;transition:border-color .2s;}
  .faq-item.open{border-color:var(--red);}
  .faq-q{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;cursor:pointer;font-size:.86rem;font-weight:700;color:var(--gray-700);user-select:none;}
  .faq-q:hover{color:var(--red);}
  .faq-icon{flex-shrink:0;font-size:1.1rem;transition:transform .25s;color:var(--gray-400);}
  .faq-item.open .faq-icon{transform:rotate(45deg);color:var(--red);}
  .faq-a{padding:0 16px;max-height:0;overflow:hidden;font-size:.83rem;color:var(--gray-500);line-height:1.75;
    transition:max-height .3s ease,padding .2s;}
  .faq-item.open .faq-a{max-height:300px;padding:0 16px 14px;}

  /* ── Mobile sticky CTA ───────────────────────── */
  .mob-sticky-bar{
    display:none;position:fixed;bottom:0;left:0;right:0;z-index:500;
    background:#fff;border-top:1.5px solid var(--gray-100);
    padding:10px 16px;align-items:center;justify-content:space-between;
    box-shadow:0 -4px 20px rgba(0,0,0,.1);
  }
  @media(max-width:1000px){.mob-sticky-bar{display:flex;}}
  .mob-sticky-left{}
  .mob-sticky-price{font-size:1rem;font-weight:800;color:var(--dark);}

  .mob-sticky-nights{font-size:.72rem;color:var(--gray-500);margin-top:1px;}
  .mob-sticky-btns{display:flex;gap:8px;}

  </style>
</head>
<body>

<div id="nav-placeholder"></div>

/* ── Visual Calendar Picker state ─────────────────── */

let CPOP_MONTH = new Date().getMonth();

const FALLBACK_IMG = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=80';

function renderRules(rules, checkin, checkout) {
  if (!rules || !rules.length) return '<li style="color:var(--gray-400)">No rules specified.</li>';
  return rules.map(r => {
    const icon = RULE_ICONS[r.icon] || RULE_ICONS.info;
    const color = r.icon === 'cancel' ? '#16a34a' : 'var(--red)';
    const text  = (r.text || '').replace('{checkin}', checkin).replace('{checkout}', checkout);
    return `<li><span class="rule-icon" style="color:${color}">${icon}</span>${esc(text)}</li>`;
  }).join('');
}

function amenityIcon(name) {
  const n = (name||'').toLowerCase();
  if (n.includes('pool'))   return AMENITY_ICONS.pool;
  if (n.includes('wifi'))   return AMENITY_ICONS.wifi;
  if (n.includes('ac')||n.includes('air')) return AMENITY_ICONS.ac;
  if (n.includes('chef')||n.includes('cook')) return AMENITY_ICONS.chef;
  if (n.includes('parking'))return AMENITY_ICONS.parking;
  if (n.includes('bbq'))    return AMENITY_ICONS.bbq;
  if (n.includes('bonfire')||n.includes('campfire')) return AMENITY_ICONS.bonfire;
  if (n.includes('kitchen'))return AMENITY_ICONS.kitchen;
  if (n.includes('beach'))  return AMENITY_ICONS.beach;
  if (n.includes('gym'))    return AMENITY_ICONS.gym;
  if (n.includes('view'))   return AMENITY_ICONS.view;
  if (n.includes('garden')) return AMENITY_ICONS.garden;
  if (n.includes('hikin')||n.includes('trek')) return AMENITY_ICONS.hiking;
  if (n.includes('breakfast')||n.includes('dining')) return AMENITY_ICONS.dining;
  if (n.includes('fort')||n.includes('heritage')) return AMENITY_ICONS.heritage;

/* ═══════════════════════════════════════════════════
   VISUAL CALENDAR POPUP — Airbnb-style two-month range
═══════════════════════════════════════════════════ */
function openCalPopup(stage, src) {
  CPOP_SRC   = src || 'desktop';
  CPOP_HOVER = null;
  // Read values from inputs (CI is written immediately on first date click)
  const ciId = CPOP_SRC === 'mobile' ? 'mob-checkin' : 'bk-checkin';
  const coId = CPOP_SRC === 'mobile' ? 'mob-checkout' : 'bk-checkout';
  const ciFromInput = document.getElementById(ciId)?.value || null;
  const coFromInput = document.getElementById(coId)?.value || null;

  if (stage === 'co' && (ciFromInput || CPOP_CI)) {
    // Re-picking checkout — keep CI from input or memory
    CPOP_CI    = ciFromInput || CPOP_CI;
    CPOP_CO    = null;
    CPOP_STAGE = 'co';
  } else {
    // Fresh start
    CPOP_CI    = null;
    CPOP_CO    = null;
    CPOP_STAGE = 'ci';
  }

  // Navigate to the month containing CI (or today)
  const d = CPOP_CI ? new Date(CPOP_CI + 'T00:00:00') : new Date();
  CPOP_YEAR  = d.getFullYear();
  CPOP_MONTH = d.getMonth();

  renderCalPopup();
  document.getElementById('cal-overlay').style.display = '';
  document.getElementById('cal-popup').style.display   = '';
  if (CPOP_SRC !== 'mobile') document.body.style.overflow = 'hidden';
}

function closeCalPopup() {
  document.getElementById('cal-overlay').style.display = 'none';
  document.getElementById('cal-popup').style.display   = 'none';
  if (CPOP_SRC !== 'mobile') document.body.style.overflow = '';
  CPOP_HOVER = null;
  document.getElementById('bk-ci-field')?.classList.remove('cal-active');
  document.getElementById('bk-co-field')?.classList.remove('cal-active');
}

function calPopupPrev() {
  CPOP_MONTH--;
  if (CPOP_MONTH < 0) { CPOP_MONTH = 11; CPOP_YEAR--; }
  renderCalPopup();
}
function calPopupNext() {
  CPOP_MONTH++;
  if (CPOP_MONTH > 11) { CPOP_MONTH = 0; CPOP_YEAR++; }
  renderCalPopup();
}

/* Switch which date you're picking by clicking a step pill */
function switchCalStage(stage) {
  if (stage === 'co' && !CPOP_CI) return; // need CI first
  CPOP_STAGE = stage;
  if (stage === 'ci') { CPOP_CI = null; CPOP_CO = null; }
  renderCalPopup();
}

/* Build one month's grid HTML for the popup */
function buildCalPopupMonthHtml(year, month) {
  const today    = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];
  const booked   = getBookedSet();
  const startDow = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const rangeEnd = (CPOP_STAGE === 'co' && CPOP_HOVER && CPOP_CI && CPOP_HOVER > CPOP_CI)
    ? CPOP_HOVER : CPOP_CO;

  let html = ['S','M','T','W','T','F','S'].map(d => `<div class="cpop-dow">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) html += `<div class="cal-day other-m"></div>`;

  for (let d = 1; d <= lastDate; d++) {
    const ds  = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt  = new Date(ds + 'T00:00:00');
    const past   = dt < today;
    const book   = booked.has(ds);
    const isCI   = ds === CPOP_CI;
    const isCO   = ds === (CPOP_CO || (CPOP_STAGE==='co'&&CPOP_HOVER===ds?CPOP_HOVER:null));
    const inRange= CPOP_CI && rangeEnd && ds > CPOP_CI && ds < rangeEnd;
    const edgeL  = isCI && rangeEnd && CPOP_CI < rangeEnd;
    const edgeR  = rangeEnd && ds === rangeEnd && CPOP_CI && CPOP_CI < rangeEnd;

    let cls = 'cal-day';
    if (past)       cls += ' disabled';
    else if (book)  cls += ' booked-d';
    if (ds === todayStr && !isCI && !isCO) cls += ' today-d';
    if (isCI)           cls += ' sel-ci';
    if (isCO && !isCI)  cls += ' sel-co';
    if (inRange)        cls += ' in-range';
    if (edgeL)          cls += ' range-edge-l';
    if (edgeR)          cls += ' range-edge-r';

    const ev = (!past && !book)
      ? ` onclick="onCalDayClick('${ds}')" onmouseenter="onCalDayHover('${ds}')" onmouseleave="onCalDayHover(null)"`
      : '';
    html += `<div class="${cls}"${ev}>${d}</div>`;
  }
  return html;
}

function renderCalPopup() {
  const g1 = document.getElementById('cal-popup-grid-1');
  const g2 = document.getElementById('cal-popup-grid-2');
  if (!g1) return;

  // Compute month 2
  let yr2 = CPOP_YEAR, mo2 = CPOP_MONTH + 1;
  if (mo2 > 11) { mo2 = 0; yr2++; }

  // Month labels
  const t1 = document.getElementById('cal-popup-title-1');
  const t2 = document.getElementById('cal-popup-title-2');
  if (t1) t1.textContent = `${MONTH_NAMES[CPOP_MONTH]} ${CPOP_YEAR}`;
  if (t2) t2.textContent = `${MONTH_NAMES[mo2]} ${yr2}`;

  // Render both grids
  g1.innerHTML = buildCalPopupMonthHtml(CPOP_YEAR, CPOP_MONTH);
  if (g2) g2.innerHTML = buildCalPopupMonthHtml(yr2, mo2);

  // Step pills — show current selection + which is active
  const fmt  = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : null;
  const pciv = document.getElementById('cal-pill-ci-val');
  const pcov = document.getElementById('cal-pill-co-val');
  const pci  = document.getElementById('cal-pill-ci');
  const pco  = document.getElementById('cal-pill-co');
  if (pciv) { pciv.textContent = CPOP_CI ? fmt(CPOP_CI) : 'Select date'; pciv.classList.toggle('empty',!CPOP_CI); }
  if (pcov) { pcov.textContent = CPOP_CO ? fmt(CPOP_CO) : 'Select date'; pcov.classList.toggle('empty',!CPOP_CO); }
  if (pci)  pci.classList.toggle('active', CPOP_STAGE === 'ci');
  if (pco)  pco.classList.toggle('active', CPOP_STAGE === 'co');

  // Hint text
  const hintEl = document.getElementById('cal-popup-hint');
  if (hintEl) {
    if (!CPOP_CI)                              hintEl.textContent = 'Select check-in date';
    else if (CPOP_STAGE === 'co' && !CPOP_CO) hintEl.textContent = 'Now select check-out date';
    else if (CPOP_CI && CPOP_CO) {
      const n = calcNights(CPOP_CI, CPOP_CO);
      hintEl.textContent = n > 0 ? `${n} night${n>1?'s':''} selected ✓` : 'Select check-out date';
    } else hintEl.textContent = '';
  }

  // Active field highlight on booking widget
  document.getElementById('bk-ci-field')?.classList.toggle('cal-active', CPOP_STAGE === 'ci');
  document.getElementById('bk-co-field')?.classList.toggle('cal-active', CPOP_STAGE === 'co');
}

function onCalDayClick(ds) {
  if (CPOP_STAGE === 'ci' || (CPOP_CI && CPOP_CO)) {
    // Start: set CI, move to CO stage
    CPOP_CI    = ds;
    CPOP_CO    = null;
    CPOP_STAGE = 'co';
    CPOP_HOVER = null;
    // Write CI to inputs immediately — fixes re-open from checkout field
    ['bk-checkin','mob-checkin'].forEach(id => { const el=document.getElementById(id); if(el) el.value=CPOP_CI; });
    ['bk-checkout','mob-checkout'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    updateCalDisplay();
  } else {
    // Picking CO
    if (ds <= CPOP_CI) {
      // Clicked on/before CI → restart CI from this date
      CPOP_CI    = ds;
      CPOP_CO    = null;
      CPOP_STAGE = 'co';
      ['bk-checkin','mob-checkin'].forEach(id => { const el=document.getElementById(id); if(el) el.value=CPOP_CI; });
      ['bk-checkout','mob-checkout'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
      updateCalDisplay();
    } else {
      // Valid CO picked — both dates set
      CPOP_CO    = ds;
      CPOP_STAGE = 'ci';
    }
  }
  renderCalPopup();
  // Auto-apply after brief pause so user sees range highlight
  if (CPOP_CI && CPOP_CO) setTimeout(applyCalDates, 280);
}

function onCalDayHover(ds) {
  CPOP_HOVER = ds;
  if (CPOP_STAGE === 'co' && CPOP_CI) renderCalPopup();
}

function applyCalDates() {
  if (!CPOP_CI) { closeCalPopup(); return; }
  if (!CPOP_CO) {
    // Only CI picked — auto set CO = CI + 1 night
    const d = new Date(CPOP_CI + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    CPOP_CO = d.toISOString().split('T')[0];
  }
  // Write to ALL date inputs (desktop + mobile)
  ['bk-checkin','mob-checkin'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = CPOP_CI;
  });
  ['bk-checkout','mob-checkout'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = CPOP_CO;
  });
  updateCalDisplay();
  closeCalPopup();
  updateBreakdown();
  updateMobTotal();
  updateMobStickyBar();
  renderAvailCalendar(); // keep availability calendar in sync
}

function clearCalDates() {
  CPOP_CI = CPOP_CO = null;
  CPOP_STAGE = 'ci';
  CPOP_HOVER = null;
  ['bk-checkin','mob-checkin','bk-checkout','mob-checkout'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  updateCalDisplay();
  renderCalPopup();
  updateBreakdown();
  renderAvailCalendar();
}

function updateCalDisplay() {
  const fmtDate = s => {
    if (!s) return null;
    return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  };
  // Desktop fields
  const ciV = document.getElementById('bk-checkin')?.value;
  const coV = document.getElementById('bk-checkout')?.value;
  const ciD = document.getElementById('cal-ci-display');
  const coD = document.getElementById('cal-co-display');
  if (ciD) { ciD.textContent = ciV ? fmtDate(ciV) : 'Select date'; ciD.classList.toggle('empty',!ciV); }

let _toastT;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.className = '', 3000);
}

/* ═══════════════════════════════════════════════════
   LOAD PROPERTY
═══════════════════════════════════════════════════ */
async function loadProperty() {
  const id = qs('id');
  if (!id) { showError('Property id missing.'); return; }
  try {
    const [{ property, host, reviews }, availRes, dpRes] = await Promise.all([
      api.getProperty(id),
      api.getAvailability(id).catch(() => ({ booked: [] })),
      api.getDatePrices(id).catch(() => ({ date_prices: [] })),
    ]);
    PROP = property;
    BOOKED_RANGES = availRes.booked || [];
    // Build date-price lookup
    DATE_PRICES = {};
    (dpRes.date_prices || []).forEach(r => { DATE_PRICES[r.date] = r; });
    // Show today's price at top by default
    const todayStr = new Date().toISOString().split('T')[0];
    const todayDp  = DATE_PRICES[todayStr];
    const todayPrice = (todayDp && todayDp.price) ? todayDp.price : property.price;
    const priceElInit = document.getElementById('bk-price-display');
    if (priceElInit) priceElInit.innerHTML = `₹${fmt(todayPrice)} <span>/ night</span>`;
    document.title = `${property.title} — StayDekho`;

    // Update SEO meta
    document.getElementById('og-title').setAttribute('content', `${property.title} — StayDekho`);
    document.getElementById('og-description').setAttribute('content', property.description || 'Premium group stay — StayDekho');
    document.getElementById('og-image').setAttribute('content', property.main_image || '');
    document.getElementById('og-url').setAttribute('content', location.href);
    document.querySelector('meta[name="description"]').setAttribute('content', property.description || 'Premium group stay — StayDekho');

    render(property, host || {}, reviews || []);
    loadSimilarProperties(property);
  } catch (e) {
    showError(e.message || 'Property not found.');
  }
}

function showError(msg) {
  document.getElementById('property-loading').innerHTML = `
    <div style="font-size:1rem;color:var(--gray-600);margin-bottom:16px">${esc(msg)}</div>
    <a href="listings.html" class="btn btn-outline">← Back to Listings</a>`;
}

/* ═══════════════════════════════════════════════════
   DATES & PRICE BREAKDOWN
═══════════════════════════════════════════════════ */
function initDates() {
  const today = new Date();
  const defCI = new Date(today); defCI.setDate(today.getDate()+1);
  const defCO = new Date(today); defCO.setDate(today.getDate()+2); // default 1 night
  const ciStr = qs('checkin')  || defCI.toISOString().split('T')[0];
  const coStr = qs('checkout') || defCO.toISOString().split('T')[0];

  ['bk-checkin','bk-checkout','mob-checkin','mob-checkout'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.min = today.toISOString().split('T')[0];
  });

  const ci = document.getElementById('bk-checkin');
  const co = document.getElementById('bk-checkout');
  const mci = document.getElementById('mob-checkin');
  const mco = document.getElementById('mob-checkout');
  if (ci)  ci.value  = ciStr;
  if (co)  co.value  = coStr;
  if (mci) mci.value = ciStr;
  if (mco) mco.value = coStr;

  if (ci) ci.addEventListener('change', () => {
    // Minimum checkout = checkin + 1 day (1 night minimum)
    const minCoDate = new Date(ci.value); minCoDate.setDate(minCoDate.getDate() + 1);
    const minCoStr = minCoDate.toISOString().split('T')[0];
    if (co) co.min = minCoStr;
    if (co && co.value <= ci.value) {
      co.value = minCoStr; // auto-set to minimum (1 night)
    }
    updateCalDisplay();
    updateBreakdown();
  });

  updateCalDisplay();
  updateBreakdown();
  updateMobTotal();
}

function calcNights(ci, co) {
  if (!ci||!co) return 0;
  const d1=new Date(ci), d2=new Date(co);
  if (d2<=d1) return 0;
  return Math.round((d2-d1)/86400000);
}
// Returns array of { date, price } for each night in [ci, co)
function nightBreakdown(ci, co) {
  if (!PROP || !ci || !co) return [];
  const nights = [];
  const d = new Date(ci);
  const end = new Date(co);
  while (d < end) {
    const dateStr = d.toISOString().split('T')[0];
    const custom  = DATE_PRICES[dateStr];
    nights.push({ date: dateStr, price: (custom && custom.price) ? custom.price : PROP.price, isCustom: !!(custom && custom.price) });
    d.setDate(d.getDate() + 1);
  }
  return nights;
}

function calcTotal(nights, ci, co) {
  if (!PROP || !nights) return 0;
  const breakdown = (ci && co) ? nightBreakdown(ci, co) : null;
  const base = breakdown ? breakdown.reduce((s, n) => s + n.price, 0) : PROP.price * nights;
  const gstRate = PROP.price > 7500 ? 0.18 : PROP.price > 1000 ? 0.12 : 0;
  return base + Math.round(base * gstRate) + Math.round(base * 0.05);
}

function updateBreakdown() {
  if (!PROP) return;
  const ci = document.getElementById('bk-checkin')?.value;
  const co = document.getElementById('bk-checkout')?.value;
  const bd = document.getElementById('bk-breakdown');
  if (!bd) return;
  const nights = calcNights(ci, co);
  if (!nights) { bd.innerHTML = ci&&co ? '<div style="color:var(--red);font-size:.82rem">Check-out must be after check-in</div>' : ''; return; }

  const perNight = nightBreakdown(ci, co);
  const base     = perNight.reduce((s, n) => s + n.price, 0);
  const gstRate  = PROP.price > 7500 ? 0.18 : PROP.price > 1000 ? 0.12 : 0;
  const gst      = Math.round(base * gstRate);
  const svc      = Math.round(base * 0.05);
  const total    = base + gst + svc;

  // Update top price display — always show avg per night of selected range
  const priceEl = document.getElementById('bk-price-display');
  if (priceEl && nights > 0) {
    const avgPerNight = Math.round(base / nights);
    priceEl.innerHTML = `₹${fmt(avgPerNight)} <span>/ night</span>`;
  }

  // Per-night breakdown (show individual dates if ≤14 nights)
  let nightsHtml;
  if (nights <= 14) {
    nightsHtml = perNight.map(n =>
      `<div class="bk-row" style="font-size:.82rem">
        <span style="color:var(--gray-500)">${n.date}</span>
        <span>₹${fmt(n.price)}</span>
      </div>`
    ).join('');
  } else {
    const avgPrice = Math.round(base / nights);
    nightsHtml = `<div class="bk-row"><span>₹${fmt(avgPrice)} × ${nights} night${nights>1?'s':''}</span><span>₹${fmt(base)}</span></div>`;
  }

  bd.innerHTML = `
    ${nightsHtml}
    <div class="bk-row"><span>Service fee</span><span>₹${fmt(svc)}</span></div>
    ${gstRate ? `<div class="bk-row"><span>GST (${gstRate*100}%)</span><span>₹${fmt(gst)}</span></div>` : ''}
    <div class="bk-row total"><span>Total</span><span>₹${fmt(total)}</span></div>`;
}

function changeGuests(delta) {

  const d=document.getElementById('guest-display'), n=document.getElementById('guest-num');
  if(d) d.textContent=`${GUESTS} guest${GUESTS!==1?'s':''}`;

/* ═══════════════════════════════════════════════════
   BOOKING / RAZORPAY
═══════════════════════════════════════════════════ */
async function initiateBooking() {
  if (!PROP) return;
  if (!api.isLoggedIn()) {
    showToast('Please login to book', 'error');
    setTimeout(()=>{window.location.href='login.html?redirect='+encodeURIComponent(location.href);},900);
    return;
  }
  const ci = document.getElementById('bk-checkin')?.value;
  const co = document.getElementById('bk-checkout')?.value;
  if (!ci||!co) { showToast('Please select check-in and check-out dates','error'); return; }
  if (new Date(co)<=new Date(ci)) { showToast('Check-out must be after check-in','error'); return; }

  const btn = document.getElementById('reserve-btn');
  if (btn) { btn.disabled=true; btn.textContent='Processing…'; }

  try {
    const bookingRes = await api.createBooking({ property_id:PROP.id, checkin:ci, checkout:co, guests:GUESTS });
    const booking = bookingRes.booking;
    let orderRes = null;
    try { orderRes = await api.createOrder(booking.id); } catch(payErr) {
      // Razorpay not configured — booking saved, admin will confirm
      showToast('Booking request sent! Our team will contact you shortly.','success');
      setTimeout(()=>{window.location.href=`guest-dashboard.html?booking_id=${booking.id}`;},1500);
      return;
    }

    if (orderRes?.order_id && orderRes?.key_id) {
      api.openRazorpay({
        order_id:orderRes.order_id, amount:orderRes.amount,
        currency:orderRes.currency||'INR', key_id:orderRes.key_id,
        booking:orderRes.booking||booking,
        onSuccess:()=>{ showToast('Payment successful! Redirecting…','success'); setTimeout(()=>{window.location.href=`guest-dashboard.html?booking_id=${booking.id}`;},1200); },
        onError:(err)=>{ showToast(err.message||'Payment cancelled','error'); if(btn){btn.disabled=false;btn.textContent='Reserve Now';} }
      });
    } else {
      showToast('Booking request sent! Redirecting…','success');
      setTimeout(()=>{window.location.href=`guest-dashboard.html?booking_id=${booking.id}`;},1200);
    }
  } catch(err) {
    showToast(err.message||'Booking failed. Please try again.','error');
    if(btn){btn.disabled=false;btn.textContent='Reserve Now';}
  }
}

/* ═══════════════════════════════════════════════════
   CATEGORY GALLERY
═══════════════════════════════════════════════════ */
function getCatList() {
  const seen = new Set();
  const cats = ['All'];
  CAT_IMAGES.forEach(i => {
    if (i.cat && !seen.has(i.cat)) { seen.add(i.cat); cats.push(i.cat); }
  });
  return cats;
}

function buildChipsHtml(active) {
  return getCatList().map(cat => {
    const count = cat === 'All' ? CAT_IMAGES.length : CAT_IMAGES.filter(i => i.cat === cat).length;
    return `<button class="cat-chip${cat === active ? ' active' : ''}"
      onclick="handleChipClick('${cat.replace(/'/g,"\\'")}')">${esc(cat)}<span class="cat-chip-count">&thinsp;${count}</span></button>`;
  }).join('');
}

function handleChipClick(cat) {
  // Update chips on main page
  document.querySelectorAll('.cat-tabs .cat-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith(cat));
  });
  openCatGallery(cat);
}

function openCatGallery(cat) {
  cat = cat || 'All';
  CG_ACTIVE_CAT = cat;
  const modal = document.getElementById('cat-gallery-modal');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Tabs inside modal
  document.getElementById('cg-cat-tabs').innerHTML = getCatList().map(c => {
    const count = c === 'All' ? CAT_IMAGES.length : CAT_IMAGES.filter(i => i.cat === c).length;
    return `<button class="cat-chip${c === cat ? ' active' : ''}"
      onclick="switchCatTab('${c.replace(/'/g,"\\'")}')">${esc(c)}<span class="cat-chip-count">&thinsp;${count}</span></button>`;
  }).join('');

  renderCatBody(cat);
  document.addEventListener('keydown', cgKeyHandler);
}

function switchCatTab(cat) {
  CG_ACTIVE_CAT = cat;
  document.querySelectorAll('#cg-cat-tabs .cat-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith(cat));
  });
  renderCatBody(cat);
  document.getElementById('cat-gallery-modal').scrollTop = 0;
}

function renderCatBody(cat) {
  const titleEl = document.getElementById('cg-modal-title');
  const bodyEl  = document.getElementById('cg-body');

  if (cat === 'All') {
    titleEl.textContent = `All Photos (${CAT_IMAGES.length})`;
    // Group by category
    const groups = {};
    CAT_IMAGES.forEach((img, flatIdx) => {
      const c = img.cat || 'Other';
      if (!groups[c]) groups[c] = [];
      groups[c].push({ ...img, flatIdx });
    });
    bodyEl.innerHTML = Object.entries(groups).map(([c, imgs]) => `
      <div class="cg-section">
        <div class="cg-section-title">${esc(c)} &thinsp;·&thinsp; ${imgs.length} photo${imgs.length!==1?'s':''}</div>
        <div class="cg-grid">
          ${imgs.map(img => `<img src="${esc(img.url)}" alt="${esc(c)}"
            onerror="this.src='${FALLBACK_IMG}'"
            onclick="openLightboxFromCat(${img.flatIdx})"/>`).join('')}
        </div>
      </div>`).join('');
  } else {
    const imgs = CAT_IMAGES.map((img, i) => ({ ...img, flatIdx: i })).filter(i => i.cat === cat);
    titleEl.textContent = `${cat} (${imgs.length})`;
    if (!imgs.length) {
      bodyEl.innerHTML = '<div class="cg-empty">No photos in this category.</div>';
      return;
    }
    bodyEl.innerHTML = `<div class="cg-section"><div class="cg-grid">
      ${imgs.map(img => `<img src="${esc(img.url)}" alt="${esc(cat)}"
        onerror="this.src='${FALLBACK_IMG}'"
        onclick="openLightboxFromCat(${img.flatIdx})"/>`).join('')}
    </div></div>`;
  }
}

function openLightboxFromCat(flatIdx) {
  // Use full CAT_IMAGES for lightbox so arrows navigate correctly
  IMAGES = CAT_IMAGES.map(i => i.url);
  closeCatGallery();
  openLightbox(flatIdx);
}

function closeCatGallery() {
  document.getElementById('cat-gallery-modal').classList.remove('open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', cgKeyHandler);
}

function cgKeyHandler(e) {
  if (e.key === 'Escape') closeCatGallery();
}

function openLightbox(idx) {
  LB_IDX=idx;
  document.getElementById('lightbox').classList.add('open');
  updateLightboxImg();

}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');

function closeLightboxOutside(e) { if(e.target===document.getElementById('lightbox'))closeLightbox(); }
function updateLightboxImg() {
  const img=document.getElementById('lb-img'), ctr=document.getElementById('lb-counter');
  img.src=IMAGES[LB_IDX]||FALLBACK_IMG;
  img.onerror=()=>{img.src=FALLBACK_IMG;};
  ctr.textContent=`${LB_IDX+1} / ${IMAGES.length}`;

function prevImg(){LB_IDX=(LB_IDX-1+IMAGES.length)%IMAGES.length;updateLightboxImg();}
function nextImg(){LB_IDX=(LB_IDX+1)%IMAGES.length;updateLightboxImg();}
function lbKeyHandler(e){
  if(e.key==='ArrowLeft')prevImg();
  if(e.key==='ArrowRight')nextImg();
  if(e.key==='Escape')closeLightbox();
}

function buildNearbyHtml(location) {
  const city = (location||'').split(',')[0].trim();
  let spots = null;
  for (const [k,v] of Object.entries(NEARBY_DATA)) {
    if (city.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(city.toLowerCase())) {
      spots = v; break;
    }
  }
  if (!spots) return '';
  return `<div class="prop-section">
    <h3>Nearby Attractions</h3>
    <div class="nearby-grid">
      ${spots.map(s=>`<div class="nearby-item">
        <span class="nearby-icon">${s.icon}</span>
        <div><div class="nearby-name">${esc(s.name)}</div><div class="nearby-dist">${esc(s.dist)}</div></div>
        <span class="nearby-badge">${esc(s.time)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════
   AVAILABILITY CALENDAR
═══════════════════════════════════════════════════ */
let CAL_YEAR  = new Date().getFullYear();
let CAL_MONTH = new Date().getMonth();
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getBookedSet() {
  const s = new Set();
  (BOOKED_RANGES||[]).forEach(r => {
    const ci = new Date(r.checkin+'T00:00:00');
    const co = new Date(r.checkout+'T00:00:00');
    for (let d=new Date(ci); d<co; d.setDate(d.getDate()+1)) s.add(d.toISOString().split('T')[0]);
  });
  return s;
}
function buildCalMonthHtml(year, month) {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];
  const startDow = new Date(year,month,1).getDay();
  const lastDate = new Date(year,month+1,0).getDate();
  const booked = getBookedSet();
  const ci = document.getElementById('bk-checkin')?.value||'';
  const co = document.getElementById('bk-checkout')?.value||'';
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell cal-empty"></div>';
  for(let d=1;d<=lastDate;d++){
    const dtStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=new Date(dtStr+'T00:00:00');
    const isPast=dt<today, isBooked=booked.has(dtStr);
    let cls='cal-cell';
    if(isPast) cls+=' cal-past';
    else if(isBooked) cls+=' cal-booked';
    else cls+=' cal-avail';
    if(dtStr===todayStr) cls+=' cal-today';
    if(dtStr===ci) cls+=' cal-ci';
    if(dtStr===co) cls+=' cal-co';
    if(ci&&co&&dtStr>ci&&dtStr<co) cls+=' cal-range';
    const ev=(!isPast&&!isBooked)?` onclick="calPickDate('${dtStr}')" onmouseenter="calHoverDate('${dtStr}')"`:'' ;
    cells+=`<div class="${cls}" data-date="${dtStr}"${ev}>${d}</div>`;
  }
  return `<div class="cal-month-block">
    <div class="cal-month-title">${MONTH_NAMES[month]} ${year}</div>
    <div class="cal-dow-row">${['S','M','T','W','T','F','S'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function renderAvailCalendar(){
  const el=document.getElementById('avail-calendar');
  const nm=document.getElementById('cal-month-name');
  if(!el) return;
  const ny=CAL_MONTH===11?CAL_YEAR+1:CAL_YEAR, nm2=CAL_MONTH===11?0:CAL_MONTH+1;
  if(nm) nm.textContent=`${MONTH_NAMES[CAL_MONTH].slice(0,3)} – ${MONTH_NAMES[nm2].slice(0,3)} ${ny}`;
  el.innerHTML=`<div class="cal-two-col" onmouseleave="calHoverDate(null)">${buildCalMonthHtml(CAL_YEAR,CAL_MONTH)}${buildCalMonthHtml(ny,nm2)}</div>`;
  updateAvailCalHint();
}
function calPrev(){CAL_MONTH--;if(CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;}renderAvailCalendar();}
function calNext(){CAL_MONTH++;if(CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;}renderAvailCalendar();}
let CAL_PICK='start', CAL_HOVER=null;
function calPickDate(dateStr){
  const ci=document.getElementById('bk-checkin');
  const co=document.getElementById('bk-checkout');
  if(!ci||!co) return;
  if(CAL_PICK==='start'||(ci.value&&co.value)){
    // First click — set CI only, wait for CO
    ci.value=dateStr; co.value=''; CAL_PICK='end'; CAL_HOVER=null;
  } else {
    if(dateStr<=ci.value){
      // Clicked same/earlier — restart: new CI, clear CO
      ci.value=dateStr; co.value=''; CAL_HOVER=null;
    } else {
      // Second click after CI — lock in CO
      co.value=dateStr; CAL_PICK='start'; CAL_HOVER=null;
    }
  }
  updateBreakdown(); updateCalDisplay(); updateMobStickyBar(); renderAvailCalendar();
}
function calHoverDate(dateStr){
  if(CAL_PICK!=='end') return; // only show preview while picking checkout
  CAL_HOVER=dateStr;
  const ci=document.getElementById('bk-checkin')?.value||'';
  const el=document.getElementById('avail-calendar');
  if(!el) return;
  // Clear previous hover highlights without re-rendering
  el.querySelectorAll('.cal-hover-range,.cal-hover-co').forEach(c=>{
    c.classList.remove('cal-hover-range','cal-hover-co');
  });
  if(!dateStr||dateStr<=ci) return;
  // Paint hover range preview
  el.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    const d=cell.dataset.date;
    if(d>ci&&d<dateStr) cell.classList.add('cal-hover-range');
    if(d===dateStr) cell.classList.add('cal-hover-co');
  });
}
function updateAvailCalHint(){
  const hint=document.getElementById('avail-cal-hint');
  if(!hint) return;
  const ci=document.getElementById('bk-checkin')?.value||'';
  const co=document.getElementById('bk-checkout')?.value||'';
  const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'';
  if(ci&&co){
    hint.textContent=`${fmt(ci)} → ${fmt(co)}`;
    hint.style.color='var(--red)'; hint.style.fontWeight='600';
  } else if(ci){
    hint.textContent='Now select check-out date ↓';
    hint.style.color='#8B1717'; hint.style.fontWeight='700';
  } else {
    hint.textContent='Select check-in date';
    hint.style.color='var(--gray-400)'; hint.style.fontWeight='500';
  }
}
function initCalendar(){
  const t=new Date(); CAL_YEAR=t.getFullYear(); CAL_MONTH=t.getMonth(); CAL_PICK='start'; CAL_HOVER=null;
  renderAvailCalendar();
}

/* ═══════════════════════════════════════════════════
   MOBILE STICKY BAR
═══════════════════════════════════════════════════ */
function updateMobStickyBar(){
  if(!PROP) return;
  const pe=document.getElementById('mob-s-price');
  const ne=document.getElementById('mob-s-nights');
  if(pe) pe.textContent=Number(PROP.price).toLocaleString('en-IN');
  if(ne){
    const ci=document.getElementById('bk-checkin')?.value;
    const co=document.getElementById('bk-checkout')?.value;
    const n=calcNights(ci,co);
    ne.textContent=n?`₹${Number(calcTotal(n,ci,co)).toLocaleString('en-IN')} total · ${n} night${n!==1?'s':''}`:'';}
}
