  <meta name="description" content="Complete Udaipur travel guide: best places to visit, 3-day itinerary, where to stay, what to eat, and travel tips. Plan your perfect Udaipur trip with StayDekho."/>

  <style>
    .tg-hero {
      background: linear-gradient(135deg, #8B1717 0%, #6b1010 60%, #3d0808 100%);
      color: #fff;
      min-height: 280px;
      display: flex;
      align-items: center;
      padding: 110px 0 70px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .tg-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .tg-hero .container { position: relative; z-index: 1; width: 100%; }
    .tg-hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin: 0 0 14px; line-height: 1.15; }
    .tg-hero p  { opacity: .85; max-width: 620px; margin: 0 auto; font-size: 1.05rem; line-height: 1.7; }
    .tg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding: 32px 0; }
    .tg-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); display: flex; flex-direction: column; }
    .tg-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
    .tg-card .body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }
    .tg-city { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--red); font-weight: 700; }
    .tg-title { font-size: 1.05rem; font-weight: 800; margin-top: 6px; }
    .tg-summary { color: var(--gray-500, #6b7280); font-size: .92rem; margin-top: 8px; flex: 1; }
    .tg-empty { color: var(--gray-400); text-align: center; padding: 60px 0; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<section class="tg-hero">
  <div class="container">
    <h1>Travel Guides</h1>
    <p>City-wise tips for India's best destinations — handpicked by people who actually run stays there. New guides added regularly.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="tg-grid" id="tg-grid">
      <div class="tg-empty">Loading guides…</div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
  function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function load() {
    const grid = document.getElementById('tg-grid');
    try {
      const { guides } = await api.listGuides();
      if (!guides.length) {
        grid.innerHTML = '<div class="tg-empty">No guides published yet — check back soon.</div>';
        return;
      }
      grid.innerHTML = guides.map(g => `
        <a class="tg-card" href="travel-guide.html?slug=${encodeURIComponent(g.slug)}">
          ${g.hero_image ? `<img src="${esc(g.hero_image)}" alt="${esc(g.title)}"/>` : ''}
          <div class="body">
            <div class="tg-city">${esc(g.city)}</div>
            <div class="tg-title">${esc(g.title)}</div>
            ${g.summary ? `<div class="tg-summary">${esc(g.summary)}</div>` : ''}
          </div>
        </a>`).join('');
    } catch (e) {
      grid.innerHTML = `<div class="tg-empty">Could not load guides: ${esc(e.message)}</div>`;
    }
  }

  // If ?slug=... → render single guide
  const slug = new URLSearchParams(location.search).get('slug');
  if (slug) {
    (async () => {
      const grid = document.getElementById('tg-grid');
      try {
        const { guide } = await api.getGuide(slug);

        // ── SEO: update meta for this specific guide ──
        const guideUrl = `https://www.staydekho.com/travel-guide.html?slug=${encodeURIComponent(guide.slug || slug)}`;
        const guideImg = guide.hero_image || 'https://www.staydekho.com/images/og-cover.jpg';
        const guideDesc = (guide.summary || guide.title || '').slice(0, 160);
        document.title = `${guide.title} — Udaipur Travel Guide | StayDekho`;
        const setM = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
        setM('meta[name="description"]', guideDesc);
        setM('meta[property="og:title"]', guide.title);
        setM('meta[property="og:description"]', guideDesc);
        setM('meta[property="og:url"]', guideUrl);
        setM('meta[property="og:image"]', guideImg);
        let canon = document.querySelector('link[rel="canonical"]');
        if (!canon) { canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
        canon.href = guideUrl;
        // TouristAttraction + Article schema
        const prev = document.getElementById('_guide_schema');
        if (prev) prev.remove();
        const sc = document.createElement('script');
        sc.type = 'application/ld+json'; sc.id = '_guide_schema';
        sc.textContent = JSON.stringify({
          '@context': 'https://schema.org', '@type': 'Article',
          headline: guide.title, description: guideDesc, image: guideImg,
          author: { '@type': 'Organization', name: 'StayDekho' },
          publisher: { '@type': 'Organization', name: 'StayDekho', logo: { '@type': 'ImageObject', url: 'https://www.staydekho.com/images/favicon.png' } },
          datePublished: guide.created_at, url: guideUrl,
          about: { '@type': 'TouristDestination', name: guide.city || 'Udaipur', touristType: 'Family, Group, Couples' },
          keywords: `${guide.city || 'udaipur'} travel guide, places to visit in ${guide.city || 'udaipur'}, ${guide.city || 'udaipur'} trip, staydekho`,
        });
        document.head.appendChild(sc);

        grid.outerHTML = `
          <article style="max-width:760px;margin:32px auto;padding:0 20px">
            <a href="travel-guide.html" style="color:var(--red);font-size:13px;font-weight:600">← All guides</a>
            ${guide.hero_image ? `<img src="${esc(guide.hero_image)}" style="width:100%;border-radius:14px;margin:14px 0 20px" alt="${esc(guide.title)}"/>` : ''}
            <div class="tg-city">${esc(guide.city)}</div>
            <h1 style="margin:4px 0 14px">${esc(guide.title)}</h1>
            ${guide.summary ? `<p style="color:var(--gray-500);font-size:1.05rem;margin-bottom:18px">${esc(guide.summary)}</p>` : ''}
            <div style="line-height:1.75;font-size:1rem;white-space:pre-wrap">${esc(guide.body)}</div>
            <div style="margin-top:32px;padding:20px;background:#fff8f8;border-radius:12px;border:1px solid #fce4e4">
              <strong style="color:#8B1717">Planning a trip to ${esc(guide.city || 'Udaipur')}?</strong>
              <p style="margin:8px 0 12px;color:#555;font-size:14px">Book a private villa directly with StayDekho — best price, no middlemen.</p>
              <a href="listings.html" style="display:inline-block;padding:10px 20px;background:#8B1717;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">Browse Villas →</a>
            </div>
          </article>`;
      } catch (e) {
        grid.innerHTML = `<div class="tg-empty">Guide not found.</div>`;
      }
    })();
  } else {
    load();
  }
</script>
</body>
</html>
